<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Maur Strassendienst</title>

<link rel="manifest" href="./manifest.json">

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: #111827;
}

body {
    overflow: hidden;
}

#app {
    width: 100%;
    height: 100%;
    position: relative;
}

header {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 1000;
    padding: 12px;
    padding-top: calc(12px + env(safe-area-inset-top));
    background: rgba(17, 24, 39, 0.95);
    color: white;
}

.header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo {
    font-size: 20px;
    font-weight: 800;
}

.subtitle {
    font-size: 12px;
    opacity: 0.75;
}

.status {
    font-size: 12px;
    padding: 6px 9px;
    border-radius: 20px;
    background: #166534;
}

.search {
    display: flex;
    gap: 7px;
    margin-top: 10px;
}

.search input {
    flex: 1;
    min-width: 0;
    border: 0;
    border-radius: 10px;
    padding: 12px;
    font-size: 15px;
    outline: none;
}

button {
    border: 0;
    border-radius: 10px;
    padding: 11px 13px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
}

.search button {
    background: white;
    color: #111827;
}

#map {
    position: absolute;
    inset: 0;
    z-index: 1;
}

.bottom-bar {
    position: absolute;
    left: 10px;
    right: 10px;
    bottom: calc(10px + env(safe-area-inset-bottom));
    z-index: 1000;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 7px;
}

.bottom-bar button {
    background: rgba(17, 24, 39, 0.95);
    color: white;
    padding: 13px 5px;
}

.panel {
    display: none;
    position: absolute;
    left: 10px;
    right: 10px;
    bottom: calc(75px + env(safe-area-inset-bottom));
    z-index: 2000;
    background: white;
    border-radius: 16px;
    padding: 16px;
    box-shadow: 0 8px 30px rgba(0,0,0,.35);
    max-height: 70vh;
    overflow-y: auto;
}

.panel h2 {
    margin: 0 0 12px;
    font-size: 19px;
}

.panel.active {
    display: block;
}

.panel-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid #e5e7eb;
}

.panel-row:last-child {
    border-bottom: 0;
}

.panel input[type="checkbox"] {
    width: 20px;
    height: 20px;
}

.close {
    width: 100%;
    margin-top: 12px;
    background: #111827;
    color: white;
}

.nav-button {
    width: 100%;
    margin-top: 8px;
    background: #2563eb;
    color: white;
}

.danger {
    background: #dc2626;
    color: white;
}

.info-box {
    background: #f3f4f6;
    border-radius: 10px;
    padding: 10px;
    margin-top: 10px;
    font-size: 14px;
}

.toast {
    display: none;
    position: absolute;
    left: 50%;
    bottom: calc(85px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    z-index: 3000;
    background: #111827;
    color: white;
    padding: 10px 15px;
    border-radius: 20px;
    font-size: 13px;
    white-space: nowrap;
}

.leaflet-control-attribution {
    font-size: 9px;
}
</style>
</head>

<body>

<div id="app">

<header>
    <div class="header-top">
        <div>
            <div class="logo">MAUR</div>
            <div class="subtitle">Strassendienst</div>
        </div>

        <div id="connectionStatus" class="status">
            ● Online
        </div>
    </div>

    <div class="search">
        <input
            id="searchInput"
            type="text"
            placeholder="Adresse oder Ort suchen..."
        >
        <button onclick="searchAddress()">Suchen</button>
    </div>
</header>

<div id="map"></div>

<div id="layersPanel" class="panel">
    <h2>Ebenen</h2>

    <div class="panel-row">
        <span>Strassen</span>
        <input id="roadsCheck" type="checkbox" checked>
    </div>

    <div class="panel-row">
        <span>Abfallkübel</span>
        <input id="binsCheck" type="checkbox">
    </div>

    <div class="panel-row">
        <span>Winterdienst</span>
        <input id="winterCheck" type="checkbox">
    </div>

    <div class="panel-row">
        <span>Sonderpunkte</span>
        <input id="specialCheck" type="checkbox">
    </div>

    <div class="panel-row">
        <span>Gemeindeliegenschaften</span>
        <input id="propertiesCheck" type="checkbox">
    </div>

    <div class="panel-row">
        <span>Eigene Punkte</span>
        <input id="ownCheck" type="checkbox" checked>
    </div>

    <button class="close" onclick="closePanels()">Schliessen</button>
</div>

<div id="navPanel" class="panel">
    <h2>Navigation</h2>

    <div class="info-box">
        <b>Ziel:</b>
        <div id="destinationText">
            Noch kein Ziel ausgewählt.
        </div>
    </div>

    <button class="nav-button" onclick="useCurrentLocationAsStart()">
        📍 Aktuellen Standort verwenden
    </button>

    <button class="nav-button" onclick="openGoogleMaps()">
        🧭 Navigation starten
    </button>

    <button class="close" onclick="closePanels()">
        Schliessen
    </button>
</div>

<div id="pointPanel" class="panel">
    <h2>Eigenen Punkt setzen</h2>

    <div class="info-box">
        Tippe anschliessend auf der Karte auf die gewünschte Stelle.
    </div>

    <button class="nav-button" onclick="startAddPoint()">
        📍 Punkt auf Karte setzen
    </button>

    <button class="close" onclick="closePanels()">
        Abbrechen
    </button>
</div>

<div id="toast" class="toast"></div>

<div class="bottom-bar">
    <button onclick="goToLocation()">📍<br>Standort</button>
    <button onclick="openLayers()">☰<br>Ebenen</button>
    <button onclick="openNavigation()">🧭<br>Navi</button>
    <button onclick="openPointPanel()">➕<br>Punkt</button>
</div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
/* =========================
   KARTE
========================= */

const map = L.map("map", {
    zoomControl: false,
    minZoom: 10,
    maxZoom: 19
}).setView([47.337, 8.667], 13);

L.control.zoom({
    position: "bottomright"
}).addTo(map);

const maurBounds = L.latLngBounds(
    [47.285, 8.595],
    [47.375, 8.735]
);

map.setMaxBounds(maurBounds);

const osmLayer = L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom: 19,
        attribution: "© OpenStreetMap contributors"
    }
);

osmLayer.addTo(map);


/* =========================
   EBENEN
========================= */

const roadsLayer = L.layerGroup().addTo(map);

const binsLayer = L.layerGroup();

const winterLayer = L.layerGroup();

const specialLayer = L.layerGroup();

const propertiesLayer = L.layerGroup();

const ownLayer = L.layerGroup().addTo(map);


/* Demo-Punkte */

L.marker([47.3375, 8.6675])
    .bindPopup("<b>Demo-Abfallkübel</b><br>Maur")
    .addTo(binsLayer);

L.marker([47.3400, 8.6700])
    .bindPopup("<b>Demo-Winterdienst</b><br>Kontrollpunkt")
    .addTo(winterLayer);

L.marker([47.3350, 8.6630])
    .bindPopup("<b>Demo-Sonderpunkt</b>")
    .addTo(specialLayer);

L.marker([47.3385, 8.6710])
    .bindPopup("<b>Demo-Gemeindeliegenschaft</b>")
    .addTo(propertiesLayer);


/* =========================
   EBENEN CHECKBOXEN
========================= */

document.getElementById("binsCheck").addEventListener("change", function() {
    toggleLayer(this, binsLayer);
});

document.getElementById("winterCheck").addEventListener("change", function() {
    toggleLayer(this, winterLayer);
});

document.getElementById("specialCheck").addEventListener("change", function() {
    toggleLayer(this, specialLayer);
});

document.getElementById("propertiesCheck").addEventListener("change", function() {
    toggleLayer(this, propertiesLayer);
});

document.getElementById("ownCheck").addEventListener("change", function() {
    toggleLayer(this, ownLayer);
});

function toggleLayer(checkbox, layer) {
    if (checkbox.checked) {
        layer.addTo(map);
    } else {
        map.removeLayer(layer);
    }
}


/* =========================
   GPS
========================= */

let currentLocationMarker = null;
let currentLocation = null;

function goToLocation() {

    if (!navigator.geolocation) {
        showToast("GPS wird von diesem Gerät nicht unterstützt.");
        return;
    }

    showToast("Standort wird gesucht...");

    navigator.geolocation.getCurrentPosition(
        function(position) {

            const lat = position.coords.latitude;
            const lng = position.coords.longitude;

            currentLocation = {
                lat: lat,
                lng: lng
            };

            if (currentLocationMarker) {
                map.removeLayer(currentLocationMarker);
            }

            currentLocationMarker = L.marker([lat, lng])
                .addTo(map)
                .bindPopup("📍 Dein aktueller Standort");

            map.setView([lat, lng], 16);

            showToast("Standort gefunden.");
        },

        function() {
            showToast("Standort konnte nicht ermittelt werden.");
        },

        {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 30000
        }
    );
}


/* =========================
   SUCHE
========================= */

async function searchAddress() {

    const input = document.getElementById("searchInput");
    const query = input.value.trim();

    if (!query) {
        showToast("Bitte Adresse eingeben.");
        return;
    }

    if (!navigator.onLine) {
        showToast("Suche benötigt Internet.");
        return;
    }

    showToast("Suche läuft...");

    try {

        const url =
            "https://nominatim.openstreetmap.org/search" +
            "?format=json" +
            "&limit=5" +
            "&countrycodes=ch" +
            "&q=" +
            encodeURIComponent(query + ", Maur, Schweiz");

        const response = await fetch(url);

        const data = await response.json();

        if (!data.length) {
            showToast("Keine Adresse gefunden.");
            return;
        }

        const result = data[0];

        const lat = Number(result.lat);
        const lon = Number(result.lon);

        map.setView([lat, lon], 17);

        const marker = L.marker([lat, lon])
            .addTo(map)
            .bindPopup(
                "<b>Suchergebnis</b><br>" +
                escapeHtml(result.display_name)
            )
            .openPopup();

        window.lastDestination = {
            lat: lat,
            lng: lon,
            name: result.display_name
        };

        document.getElementById("destinationText").textContent =
            result.display_name;

        showToast("Adresse gefunden.");

    } catch (error) {

        showToast("Suche fehlgeschlagen.");
    }
}


/* =========================
   EIGENE PUNKTE
========================= */

let addingPoint = false;

function openPointPanel() {
    closePanels();
    document.getElementById("pointPanel").classList.add("active");
}

function startAddPoint() {

    closePanels();

    addingPoint = true;

    showToast("Tippe jetzt auf die Karte.");

    map.getContainer().style.cursor = "crosshair";
}

map.on("click", function(e) {

    if (!addingPoint) {

        window.lastDestination = {
            lat: e.latlng.lat,
            lng: e.latlng.lng,
            name: "Kartenziel"
        };

        document.getElementById("destinationText").textContent =
            e.latlng.lat.toFixed(6) +
            ", " +
            e.latlng.lng.toFixed(6);

        return;
    }

    addingPoint = false;

    map.getContainer().style.cursor = "";

    const name = prompt("Name des Punktes:");

    if (!name) {
        return;
    }

    const description = prompt("Beschreibung (optional):") || "";

    const point = {
        id: Date.now(),
        name: name,
        description: description,
        lat: e.latlng.lat,
        lng: e.latlng.lng
    };

    saveOwnPoint(point);

    createOwnMarker(point);

    showToast("Punkt gespeichert.");
});


function createOwnMarker(point) {

    const marker = L.marker([point.lat, point.lng])
        .addTo(ownLayer);

    marker.bindPopup(`
        <b>${escapeHtml(point.name)}</b>
        <br>
        ${escapeHtml(point.description)}
        <br><br>
        <button onclick="deleteOwnPoint(${point.id})"
            style="background:#dc2626;color:white;padding:8px;border-radius:8px;border:0;">
            Punkt löschen
        </button>
    `);
}


function saveOwnPoint(point) {

    const points = getOwnPoints();

    points.push(point);

    localStorage.setItem(
        "maurOwnPoints",
        JSON.stringify(points)
    );
}


function getOwnPoints() {

    try {

        return JSON.parse(
            localStorage.getItem("maurOwnPoints")
        ) || [];

    } catch {

        return [];
    }
}


function deleteOwnPoint(id) {

    const points = getOwnPoints()
        .filter(point => point.id !== id);

    localStorage.setItem(
        "maurOwnPoints",
        JSON.stringify(points)
    );

    ownLayer.clearLayers();

    loadOwnPoints();

    showToast("Punkt gelöscht.");
}


function loadOwnPoints() {

    const points = getOwnPoints();

    points.forEach(point => {
        createOwnMarker(point);
    });
}

loadOwnPoints();


/* =========================
   NAVIGATION
========================= */

function openNavigation() {

    closePanels();

    document.getElementById("navPanel").classList.add("active");
}

function useCurrentLocationAsStart() {

    if (!currentLocation) {
        goToLocation();

        showToast(
            "Standort wird ermittelt. Danach erneut drücken."
        );

        return;
    }

    showToast("Aktueller Standort wird als Start verwendet.");
}


function openGoogleMaps() {

    if (!window.lastDestination) {

        showToast("Bitte zuerst ein Ziel auswählen.");

        return;
    }

    const destination =
        window.lastDestination.lat +
        "," +
        window.lastDestination.lng;

    let url;

    if (currentLocation) {

        const origin =
            currentLocation.lat +
            "," +
            currentLocation.lng;

        url =
            "https://www.google.com/maps/dir/?api=1" +
            "&origin=" +
            encodeURIComponent(origin) +
            "&destination=" +
            encodeURIComponent(destination) +
            "&travelmode=driving";

    } else {

        url =
            "https://www.google.com/maps/dir/?api=1" +
            "&destination=" +
            encodeURIComponent(destination) +
            "&travelmode=driving";
    }

    window.open(url, "_blank");
}


/* =========================
   PANELS
========================= */

function openLayers() {

    closePanels();

    document.getElementById("layersPanel")
        .classList.add("active");
}

function closePanels() {

    document.querySelectorAll(".panel")
        .forEach(panel => {
            panel.classList.remove("active");
        });
}


/* =========================
   ONLINE / OFFLINE
========================= */

function updateConnectionStatus() {

    const status =
        document.getElementById("connectionStatus");

    if (navigator.onLine) {

        status.textContent = "● Online";
        status.style.background = "#166534";

    } else {

        status.textContent = "● Offline";
        status.style.background = "#991b1b";
    }
}

window.addEventListener(
    "online",
    updateConnectionStatus
);

window.addEventListener(
    "offline",
    updateConnectionStatus
);

updateConnectionStatus();


/* =========================
   TOAST
========================= */

function showToast(message) {

    const toast =
        document.getElementById("toast");

    toast.textContent = message;

    toast.style.display = "block";

    clearTimeout(window.toastTimer);

    window.toastTimer =
        setTimeout(() => {
            toast.style.display = "none";
        }, 2500);
}


/* =========================
   SICHERHEIT
========================= */

function escapeHtml(text) {

    return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


/* =========================
   SERVICE WORKER
========================= */

if ("serviceWorker" in navigator) {

    window.addEventListener("load", () => {

        navigator.serviceWorker
            .register("./sw.js")
            .then(() => {

                console.log(
                    "Maur Strassendienst: Offline-Modus aktiviert"
                );

            })
            .catch(error => {

                console.error(
                    "Service Worker Fehler:",
                    error
                );

            });

    });
}

</script>

</body>
</html>
