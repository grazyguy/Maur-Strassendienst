<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Maur Strassendienst V16</title>

<link rel="manifest" href="./manifest.json">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  height:100%;
  overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:#f3f4f6;
  color:#111827
}

button,input{font:inherit}
button{border:0;cursor:pointer}

.topbar{
  height:64px;
  background:#111827;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px;
  position:relative;
  z-index:1000
}

.brand{font-weight:800;font-size:16px}

.status{
  font-size:10px;
  color:#9ca3af;
  margin-top:3px
}

.iconbtn{
  width:42px;
  height:42px;
  border-radius:12px;
  background:#1f2937;
  color:white;
  font-size:20px
}

.searchwrap{
  position:absolute;
  z-index:1100;
  top:76px;
  left:12px;
  right:12px
}

.search{
  width:100%;
  height:48px;
  border:1px solid #d1d5db;
  border-radius:14px;
  padding:0 15px;
  background:white;
  box-shadow:0 3px 14px #0002;
  outline:none
}

.results{
  background:white;
  border-radius:0 0 14px 14px;
  box-shadow:0 5px 15px #0002;
  overflow:hidden
}

.result{
  padding:12px 14px;
  border-top:1px solid #e5e7eb
}

.result small{
  display:block;
  color:#6b7280;
  margin-top:3px
}

.panel{
  position:absolute;
  z-index:1200;
  left:12px;
  right:12px;
  top:76px;
  background:white;
  border-radius:16px;
  box-shadow:0 8px 25px #0003;
  max-height:calc(100vh - 150px);
  overflow:auto;
  padding:16px;
  display:none
}

.panel.open{display:block}

.panel h2{
  margin:0 0 14px;
  font-size:18px
}

.panel h3{
  margin:18px 0 8px;
  font-size:14px
}

.close{
  float:right;
  width:36px;
  height:36px;
  border-radius:10px;
  background:#f3f4f6
}

.seg{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px
}

.seg button{
  padding:10px 5px;
  border-radius:10px;
  background:#e5e7eb
}

.seg button.active{
  background:#2563eb;
  color:white
}

.setting-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 0;
  border-bottom:1px solid #e5e7eb
}

.setting-row input{
  width:19px;
  height:19px
}

.primary{
  background:#2563eb;
  color:white;
  padding:11px;
  border-radius:10px;
  width:100%
}

.hint{
  font-size:12px;
  color:#6b7280;
  line-height:1.45
}

.navinfo{
  position:absolute;
  z-index:1050;
  left:12px;
  right:12px;
  bottom:84px;
  background:white;
  border-radius:16px;
  padding:12px;
  box-shadow:0 5px 18px #0003;
  display:none
}

.navinfo.show{display:block}

.navmain{font-weight:800}

.navsub{
  font-size:13px;
  color:#6b7280;
  margin-top:3px
}

.navbuttons{
  display:flex;
  gap:8px;
  margin-top:10px
}

.navbuttons button{
  flex:1;
  background:#111827;
  color:white;
  padding:10px;
  border-radius:10px
}

.navbuttons .off{
  background:#e5e7eb;
  color:#111827
}

.bottom{
  height:72px;
  position:absolute;
  z-index:1000;
  bottom:0;
  left:0;
  right:0;
  background:white;
  border-top:1px solid #d1d5db;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  padding-bottom:env(safe-area-inset-bottom)
}

.bottom button{
  background:white;
  color:#6b7280;
  font-size:11px
}

.bottom button.active{
  color:#2563eb;
  font-weight:800
}

.bottom span{
  display:block;
  font-size:21px;
  margin-bottom:2px
}

.toast{
  position:absolute;
  z-index:1500;
  left:50%;
  transform:translateX(-50%);
  bottom:90px;
  background:#111827;
  color:white;
  padding:11px 15px;
  border-radius:12px;
  font-size:13px;
  display:none;
  max-width:90%;
  text-align:center
}

.toast.show{display:block}

.point-item{
  padding:10px 0;
  border-bottom:1px solid #e5e7eb
}

.point-actions{
  display:flex;
  gap:7px;
  margin-top:7px
}

.smallbtn{
  padding:7px 9px;
  border-radius:9px;
  background:#e5e7eb
}

.danger{
  background:#fee2e2;
  color:#991b1b
}

.mapmsg{
  position:absolute;
  z-index:1050;
  left:12px;
  right:12px;
  top:132px;
  background:#fee2e2;
  color:#991b1b;
  padding:10px 12px;
  border-radius:12px;
  display:none
}

.leaflet-container{
  background:#f3f4f6
}

#map{
  position:absolute;
  top:64px;
  bottom:72px;
  left:0;
  right:0;
  z-index:1
}

/* ---------------------------------------------------------
   LEAFLET EBENEN
   --------------------------------------------------------- */

.leaflet-pane.maur-mask-pane{
  z-index:350;
}

.leaflet-pane.road-pane{
  z-index:450;
}

.leaflet-pane.label-pane{
  z-index:500;
}

.leaflet-pane.ort-pane{
  z-index:600;
}

.leaflet-pane.boundary-pane{
  z-index:700;
}

/* Gemeindegrenze */

.maur-border-casing{
  stroke:#ffffff;
  stroke-width:12;
  stroke-opacity:1
}

.maur-border{
  stroke:#0057d9;
  stroke-width:6;
  stroke-opacity:1;
  fill:none
}

/* Maske */

.maur-mask{
  stroke:none;
  fill:#ffffff;
  fill-opacity:1;
  fill-rule:evenodd;
  pointer-events:none
}

/* Ortsgrenzen */

.ort-border-casing{
  stroke:#ffffff;
  stroke-width:8;
  stroke-opacity:1
}

.ort-border{
  stroke:#0066ff;
  stroke-width:4;
  stroke-dasharray:10 8;
  stroke-opacity:1;
  fill:#0066ff;
  fill-opacity:.025
}

.maur-label{
  background:#0057d9;
  border:2px solid white;
  color:white;
  font-weight:800;
  font-size:13px;
  padding:4px 8px;
  border-radius:8px;
  box-shadow:0 2px 7px #0005
}

.leaflet-tooltip.street-label,
.leaflet-tooltip.house-label{
  background:transparent;
  border:0;
  box-shadow:none;
  color:#111827;
  font-weight:700;
  text-shadow:
    0 1px 2px #fff,
    1px 0 2px #fff,
    -1px 0 2px #fff;
  font-size:12px
}
</style>
</head>

<body>

<header class="topbar">
  <div>
    <div class="brand">MAUR STRASSENDIENST</div>
    <div class="status" id="status">ONLINE • V16</div>
  </div>

  <button class="iconbtn" id="settingsBtn">⚙️</button>
</header>

<div class="searchwrap" id="searchWrap">
  <input
    id="search"
    class="search"
    placeholder="Ort, Strasse oder Adresse suchen …"
    autocomplete="off"
  >
  <div id="results" class="results"></div>
</div>

<div id="mapmsg" class="mapmsg"></div>
<div id="map"></div>

<section id="navInfo" class="navinfo">

  <div id="navMain" class="navmain">
    Keine Navigation aktiv
  </div>

  <div id="navSub" class="navsub"></div>

  <div class="navbuttons">

    <button id="voiceBtn">
      🔊 Sprache an
    </button>

    <button id="followBtn">
      📍 Folgen aus
    </button>

    <button id="stopNavBtn">
      ✕ Stop
    </button>

  </div>

</section>

<section id="settingsPanel" class="panel">

  <button class="close" id="closeSettings">✕</button>

  <h2>Einstellungen</h2>

  <h3>Kartenansicht</h3>

  <div class="seg">
    <button data-view="normal">Normal</button>
    <button data-view="satellite">Satellit</button>
    <button data-view="hybrid">Hybrid</button>
  </div>

  <div class="setting-row">
    <span>Gemeindegrenze Maur</span>
    <input type="checkbox" id="toggleBorders" checked>
  </div>

  <div class="setting-row">
    <span>Strassennamen</span>
    <input type="checkbox" id="toggleStreetNames" checked>
  </div>

  <div class="setting-row">
    <span>Hausnummern</span>
    <input type="checkbox" id="toggleHouseNumbers" checked>
  </div>

  <div class="setting-row">
    <span>Gebäude</span>
    <input type="checkbox" id="toggleBuildings" checked>
  </div>

  <div class="setting-row">
    <span>Strassen</span>
    <input type="checkbox" id="toggleRoads" checked>
  </div>

  <h3>GPS</h3>

  <button class="primary" id="locateBtn">
    📍 Meinen Standort zeigen
  </button>

  <p class="hint">
    Nur Gemeinde Maur wird angezeigt.
    Beim Zoomen wird die Karte nicht mehr zurückgesetzt.
  </p>

</section>

<section id="pointsPanel" class="panel">

  <button class="close" id="closePoints">✕</button>

  <h2>Eigene Punkte</h2>

  <button class="primary" id="addPointBtn">
    ＋ Punkt an aktueller Position speichern
  </button>

  <div id="pointsList"></div>

</section>

<nav class="bottom">

  <button id="navTab" class="active">
    <span>🧭</span>Navi
  </button>

  <button id="gpsTab">
    <span>📍</span>GPS
  </button>

  <button id="pointsTab">
    <span>⭐</span>Punkte
  </button>

  <button id="mapTab">
    <span>🗺️</span>Karte
  </button>

</nav>

<div id="toast" class="toast"></div>

<script>

/* =========================================================
   MAUR STRASSENDIENST V16
   =========================================================

   WICHTIG:
   KEIN maxBounds
   KEIN setMaxBounds
   KEIN maxBoundsViscosity

   Dadurch kann Leaflet beim Zoomen nicht mehr
   automatisch zurückspringen.

   Maur bleibt optisch durch die Maske begrenzt.
   ========================================================= */

const CENTER = [47.337,8.667];

const OSRM =
  'https://router.project-osrm.org/route/v1/driving/';

const WFS_URL =
  'https://maps.zh.ch/wfs/OGDZHWFS' +
  '?service=WFS' +
  '&version=1.1.0' +
  '&request=GetFeature' +
  '&typeName=ms:OGDZHWFS_GEMEINDEGEBIET' +
  '&outputFormat=application/json' +
  '&srsName=EPSG:4326';

const NOMINATIM =
  'https://nominatim.openstreetmap.org/search';

const ORTSCHAFTEN = [
  'FORCH',
  'AESCH',
  'BINZ',
  'MAUR',
  'UESSIKON'
];

let map;
let osm;
let sat;

let streetNames;
let houseNumbers;

let userMarker = null;
let destMarker = null;

let currentPosition = null;
let destination = null;

let navigationActive = false;
let followEnabled = false;
let voiceEnabled = true;

let lastReroute = 0;
let routeLayer = null;

let maurBoundary = null;
let maurMask = null;
let ortLayers = [];

let ownMarkers = [];
let ownPoints = [];

let maurBounds = null;


/* =========================================================
   HILFSFUNKTIONEN
   ========================================================= */

function toast(text,ms=2600){

  const e =
    document.getElementById('toast');

  e.textContent = text;

  e.classList.add('show');

  clearTimeout(toast.t);

  toast.t =
    setTimeout(()=>{
      e.classList.remove('show');
    },ms);

}


function status(text){

  document.getElementById(
    'status'
  ).textContent = text;

}


function esc(s){

  return String(s ?? '').replace(
    /[&<>"']/g,
    c => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[c])
  );

}


/* =========================================================
   KARTE
   ========================================================= */

map = L.map('map',{

  zoomControl:true,

  preferCanvas:true,

  /*
    Kein maxBounds!
    Dadurch kein Zurückspringen.
  */

  minZoom:8,

  maxZoom:19,

  zoomAnimation:true,

  fadeAnimation:true

}).setView(
  CENTER,
  12.5
);


/* ---------------------------------------------------------
   EIGENE LEAFLET PANES
   --------------------------------------------------------- */

map.createPane('maurMaskPane');

map.getPane('maurMaskPane').style.zIndex = 350;


map.createPane('roadPane');

map.getPane('roadPane').style.zIndex = 450;


map.createPane('labelPane');

map.getPane('labelPane').style.zIndex = 500;


map.createPane('ortPane');

map.getPane('ortPane').style.zIndex = 600;


map.createPane('boundaryPane');

map.getPane('boundaryPane').style.zIndex = 700;


/* =========================================================
   OSM
   ========================================================= */

osm = L.tileLayer(
  'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {
    maxZoom:19,
    subdomains:['a','b','c'],
    attribution:'© OpenStreetMap contributors'
  }
).addTo(map);


/* =========================================================
   SATELLIT
   ========================================================= */

sat = L.tileLayer(
  'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  {
    maxZoom:19,
    attribution:'© Esri World Imagery'
  }
);


/* =========================================================
   OFFIZIELLE SCHWEIZER STRASSENNAMEN
   ========================================================= */

streetNames = L.tileLayer.wms(
  'https://wms.geo.admin.ch/',
  {
    layers:
      'ch.swisstopo.amtliches-strassenverzeichnis',

    styles:'default',

    format:'image/png',

    transparent:true,

    version:'1.3.0',

    opacity:1,

    pane:'labelPane',

    attribution:
      '© swisstopo / geo.admin.ch',

    minZoom:14,

    maxZoom:20
  }
).addTo(map);


/* =========================================================
   OFFIZIELLE SCHWEIZER HAUSNUMMERN
   ========================================================= */

houseNumbers = L.tileLayer.wms(
  'https://wms.geo.admin.ch/',
  {
    layers:
      'ch.swisstopo.amtliches-gebaeudeadressverzeichnis',

    styles:'default',

    format:'image/png',

    transparent:true,

    version:'1.3.0',

    opacity:1,

    pane:'labelPane',

    attribution:
      '© swisstopo / geo.admin.ch',

    minZoom:16,

    maxZoom:20
  }
).addTo(map);


/* =========================================================
   START
   ========================================================= */

map.whenReady(async()=>{

  await loadMaurOnly();

  startGPS();

  restoreSettings();

  loadPoints();

  renderPoints();

  toast(
    'Maur Strassendienst V16 geladen.'
  );

});


/* =========================================================
   GEMEINDE MAUR LADEN
   ========================================================= */

async function loadMaurOnly(){

  try{

    status(
      'ONLINE • Lade Gemeinde Maur …'
    );


    const r =
      await fetch(
        WFS_URL,
        {
          cache:'no-store'
        }
      );


    if(!r.ok){

      throw new Error(
        'WFS '+r.status
      );

    }


    const geo =
      await r.json();


    const features =
      geo.features || [];


    let maurFeature =
      features.find(
        f=>{

          const p =
            f.properties || {};

          return Object.values(p).some(
            v=>
              String(v ?? '')
                .trim()
                .toUpperCase()
              ===
              'MAUR'
          );

        }
      );


    if(!maurFeature){

      maurFeature =
        features.find(
          f=>{

            const p =
              f.properties || {};

            return Object.values(p).some(
              v=>
                String(v ?? '')
                  .toUpperCase()
                  .includes('MAUR')
            );

          }
        );

    }


    if(!maurFeature){

      throw new Error(
        'Gemeinde Maur nicht gefunden'
      );

    }


    /* -----------------------------------------------------
       GEMEINDEGRENZE
       ----------------------------------------------------- */

    maurBoundary =
      L.geoJSON(
        maurFeature,
        {
          pane:'boundaryPane',

          style:{
            color:'#0057d9',
            weight:6,
            opacity:1,
            fill:false
          },

          interactive:false
        }
      ).addTo(map);


    maurBounds =
      maurBoundary.getBounds();


    /* -----------------------------------------------------
       ERSTE ANSICHT
       -----------------------------------------------------

       fitBounds wird NUR EINMAL beim Laden benutzt.

       Beim späteren Zoomen wird fitBounds NICHT mehr
       automatisch aufgerufen.
       ----------------------------------------------------- */

    map.fitBounds(
      maurBounds.pad(.06),
      {
        animate:false
      }
    );


    /* -----------------------------------------------------
       MASKE
       ----------------------------------------------------- */

    createMaurMask(
      maurFeature.geometry
    );


    /* -----------------------------------------------------
       ORTSCHAFTEN
       ----------------------------------------------------- */

    await loadOrtschaftsgrenzen();


    status(
      'ONLINE • NUR GEMEINDE MAUR'
    );


    toast(
      'Gemeinde Maur geladen',
      2500
    );


  }catch(e){

    console.warn(
      'Maur-Gemeindegrenze:',
      e
    );


    status(
      'ONLINE • Gemeindegrenze nicht geladen'
    );


    showMapMsg(
      'Die Karte läuft, aber die Gemeindegrenze von Maur konnte momentan nicht geladen werden.'
    );

  }

}


/* =========================================================
   MASKE AUSSERHALB MAUR
   ========================================================= */

function createMaurMask(geometry){

  if(maurMask){

    map.removeLayer(
      maurMask
    );

  }


  if(!geometry){

    return;

  }


  /*
    Welt-Aussenring.
  */

  const world = [

    [90,-180],

    [90,180],

    [-90,180],

    [-90,-180],

    [90,-180]

  ];


  const rings = [];


  /*
    POLYGON
  */

  if(
    geometry.type === 'Polygon'
  ){

    const coords =
      geometry.coordinates || [];


    coords.forEach(
      ring=>{

        if(
          ring &&
          ring.length
        ){

          rings.push(
            ring.map(
              p=>[
                p[1],
                p[0]
              ]
            )
          );

        }

      }
    );

  }


  /*
    MULTIPOLYGON
  */

  if(
    geometry.type === 'MultiPolygon'
  ){

    const polys =
      geometry.coordinates || [];


    polys.forEach(
      poly=>{

        if(!poly){
          return;
        }


        poly.forEach(
          ring=>{

            if(
              ring &&
              ring.length
            ){

              rings.push(
                ring.map(
                  p=>[
                    p[1],
                    p[0]
                  ]
                )
              );

            }

          }
        );

      }
    );

  }


  /*
    Welt + Maur-Ringe.

    fillRule evenodd sorgt dafür,
    dass Maur als Loch sichtbar bleibt.
  */

  maurMask =
    L.polygon(
      [
        world,
        ...rings
      ],
      {
        pane:'maurMaskPane',

        stroke:false,

        fillColor:'#ffffff',

        fillOpacity:1,

        fillRule:'evenodd',

        interactive:false,

        className:'maur-mask'
      }
    ).addTo(map);

}


/* =========================================================
   ORTSCHAFTSGRENZEN
   ========================================================= */

async function loadOrtschaftsgrenzen(){

  ortLayers.forEach(
    l=>{

      if(map.hasLayer(l)){
        map.removeLayer(l);
      }

    }
  );


  ortLayers=[];


  for(
    const ort of ORTSCHAFTEN
  ){

    try{

      const url =
        NOMINATIM +
        '?format=jsonv2' +
        '&polygon_geojson=1' +
        '&limit=1' +
        '&countrycodes=ch' +
        '&q=' +
        encodeURIComponent(
          ort+
          ', Maur, Zürich, Schweiz'
        );


      const r =
        await fetch(
          url,
          {
            headers:{
              Accept:
                'application/json'
            }
          }
        );


      if(!r.ok){
        continue;
      }


      const data =
        await r.json();


      if(!data.length){
        continue;
      }


      const x =
        data[0];


      if(!x.geojson){
        continue;
      }


      const layer =
        L.geoJSON(
          x.geojson,
          {
            pane:'ortPane',

            style:{
              color:'#0066ff',
              weight:4,
              opacity:1,
              dashArray:'10 8',
              fillColor:'#0066ff',
              fillOpacity:.025
            },

            interactive:false
          }
        );


      layer.eachLayer(
        l=>{

          try{

            l.bindTooltip(
              ort,
              {
                sticky:true,
                direction:'center',
                className:
                  'maur-label'
              }
            );

          }catch(e){}

        }
      );


      layer.addTo(map);

      ortLayers.push(
        layer
      );


      await new Promise(
        resolve=>
          setTimeout(
            resolve,
            800
          )
      );


    }catch(e){

      console.warn(
        'Ortschaft '+ort,
        e
      );

    }

  }

}


/* =========================================================
   KARTENANSICHT
   ========================================================= */

function changeView(v){

  localStorage.setItem(
    'maurMapView',
    v
  );


  document
    .querySelectorAll(
      '[data-view]'
    )
    .forEach(
      b=>{
        b.classList.toggle(
          'active',
          b.dataset.view===v
        );
      }
    );


  if(v==='normal'){

    if(!map.hasLayer(osm)){
      osm.addTo(map);
    }

    osm.setOpacity(1);


    if(map.hasLayer(sat)){
      map.removeLayer(sat);
    }

  }


  else if(
    v==='satellite'
  ){

    if(map.hasLayer(osm)){
      map.removeLayer(osm);
    }


    if(!map.hasLayer(sat)){
      sat.addTo(map);
    }

  }


  else{

    if(!map.hasLayer(sat)){
      sat.addTo(map);
    }


    if(!map.hasLayer(osm)){
      osm.addTo(map);
    }


    osm.setOpacity(.48);

  }

}


/* =========================================================
   EINSTELLUNGEN
   ========================================================= */

function restoreSettings(){

  changeView(
    localStorage.getItem(
      'maurMapView'
    ) || 'normal'
  );


  [
    'toggleBorders',
    'toggleStreetNames',
    'toggleHouseNumbers',
    'toggleBuildings',
    'toggleRoads'
  ].forEach(
    id=>{

      const v =
        localStorage.getItem(id);


      if(v!==null){

        document.getElementById(
          id
        ).checked =
          v==='true';

      }

    }
  );


  toggleBorders();

  toggleMapLabels();

  toggleOptional();


  status(
    'ONLINE • NUR GEMEINDE MAUR'
  );

}


/* =========================================================
   GEMEINDEGRENZE
   ========================================================= */

function toggleBorders(){

  const on =
    document.getElementById(
      'toggleBorders'
    ).checked;


  localStorage.setItem(
    'toggleBorders',
    on
  );


  if(!maurBoundary){
    return;
  }


  if(on){

    maurBoundary.addTo(map);

  }else{

    map.removeLayer(
      maurBoundary
    );

  }

}


/* =========================================================
   STRASSENNAMEN / HAUSNUMMERN
   ========================================================= */

function toggleMapLabels(){

  const streets =
    document.getElementById(
      'toggleStreetNames'
    ).checked;


  const houses =
    document.getElementById(
      'toggleHouseNumbers'
    ).checked;


  localStorage.setItem(
    'toggleStreetNames',
    streets
  );


  localStorage.setItem(
    'toggleHouseNumbers',
    houses
  );


  if(streets){

    if(!map.hasLayer(
      streetNames
    )){

      streetNames.addTo(map);

    }

  }else{

    if(map.hasLayer(
      streetNames
    )){

      map.removeLayer(
        streetNames
      );

    }

  }


  if(houses){

    if(!map.hasLayer(
      houseNumbers
    )){

      houseNumbers.addTo(map);

    }

  }else{

    if(map.hasLayer(
      houseNumbers
    )){

      map.removeLayer(
        houseNumbers
      );

    }

  }

}


/* =========================================================
   OPTIONALE EINSTELLUNGEN
   ========================================================= */

function toggleOptional(){

  const b =
    document.getElementById(
      'toggleBuildings'
    ).checked;


  const r =
    document.getElementById(
      'toggleRoads'
    ).checked;


  localStorage.setItem(
    'toggleBuildings',
    b
  );


  localStorage.setItem(
    'toggleRoads',
    r
  );

}


/* =========================================================
   GPS
   ========================================================= */

function startGPS(){

  if(!navigator.geolocation){

    status(
      'GPS nicht verfügbar'
    );

    return;

  }


  navigator.geolocation.watchPosition(

    updateGPS,

    e=>{

      console.warn(e);

      status(
        'ONLINE • GPS wartet'
      );

    },

    {
      enableHighAccuracy:true,
      maximumAge:5000,
      timeout:15000
    }

  );

}


function updateGPS(p){

  currentPosition = {

    lat:p.coords.latitude,

    lng:p.coords.longitude,

    accuracy:p.coords.accuracy

  };


  status(
    'ONLINE • GPS '+
    Math.round(
      p.coords.accuracy
    )+
    ' m'
  );


  const ll=[
    currentPosition.lat,
    currentPosition.lng
  ];


  if(!userMarker){

    userMarker =
      L.circleMarker(
        ll,
        {
          radius:8,
          color:'#fff',
          weight:3,
          fillColor:'#2563eb',
          fillOpacity:1
        }
      ).addTo(map);

  }else{

    userMarker.setLatLng(
      ll
    );

  }


  /*
    Nur wenn FOLLOW aktiv,
    darf GPS die Karte bewegen.
  */

  if(
    followEnabled &&
    maurBounds &&
    maurBounds.contains(ll)
  ){

    map.setView(
      ll,
      Math.max(
        map.getZoom(),
        16
      ),
      {
        animate:true
      }
    );

  }


  if(
    navigationActive &&
    destination &&
    Date.now()-lastReroute>10000
  ){

    lastReroute =
      Date.now();


    routeTo(
      destination,
      false
    );

  }

}


/* =========================================================
   GPS ANZEIGEN
   ========================================================= */

function goToLocation(){

  if(!currentPosition){

    toast(
      'GPS wird noch gesucht.'
    );

    return;

  }


  if(
    maurBounds &&
    !maurBounds.contains([
      currentPosition.lat,
      currentPosition.lng
    ])
  ){

    toast(
      'Dein GPS befindet sich ausserhalb der Gemeinde Maur.'
    );

    return;

  }


  setFollow(true);

}


/* =========================================================
   SUCHE
   ========================================================= */

const search =
  document.getElementById(
    'search'
  );


const results =
  document.getElementById(
    'results'
  );


let timer;


search.addEventListener(
  'input',
  ()=>{

    clearTimeout(timer);


    const q =
      search.value.trim();


    if(q.length<3){

      results.innerHTML='';

      return;

    }


    timer =
      setTimeout(
        ()=>doSearch(q),
        350
      );

  }
);


/* =========================================================
   ADRESSSUCHE
   ========================================================= */

async function doSearch(q){

  results.innerHTML =
    '<div class="result">Suche …</div>';


  try{

    const url =
      NOMINATIM +
      '?format=jsonv2' +
      '&limit=8' +
      '&countrycodes=ch' +
      '&q='+
      encodeURIComponent(
        q+
        ', Maur, Zürich, Schweiz'
      );


    const r =
      await fetch(
        url,
        {
          headers:{
            Accept:
              'application/json'
          }
        }
      );


    const d =
      await r.json();


    if(!d.length){

      results.innerHTML =
        '<div class="result">Nichts gefunden.</div>';

      return;

    }


    results.innerHTML =
      d.map(
        (x,i)=>`

        <div
          class="result"
          data-i="${i}"
        >

          <b>
            ${esc(
              x.display_name
                .split(',')
                .slice(0,2)
                .join(', ')
            )}
          </b>

          <small>
            ${esc(
              x.display_name
            )}
          </small>

        </div>

        `
      ).join('');


    [
      ...results.children
    ].forEach(
      (e,i)=>{

        e.onclick =
          ()=>{
            selectSearch(
              d[i]
            );
          };

      }
    );


  }catch(e){

    console.warn(e);


    results.innerHTML =
      '<div class="result">Suche nicht verfügbar.</div>';

  }

}


/* =========================================================
   SUCHERGEBNIS
   ========================================================= */

function selectSearch(x){

  const c=[

    Number(x.lat),

    Number(x.lon)

  ];


  if(
    maurBounds &&
    !maurBounds.contains(c)
  ){

    toast(
      'Dieses Ziel liegt ausserhalb der Gemeinde Maur.'
    );

    return;

  }


  setFollow(false);


  search.value =
    x.display_name
      ?.split(',')
      .slice(0,2)
      .join(', ')
    ||
    'Ziel';


  results.innerHTML='';


  destination=[
    c[1],
    c[0]
  ];


  if(destMarker){

    map.removeLayer(
      destMarker
    );

  }


  destMarker =
    L.marker(c)
      .addTo(map)
      .bindPopup('Ziel')
      .openPopup();


  map.setView(
    c,
    16
  );


  routeTo(
    destination,
    true
  );

}


/* =========================================================
   ROUTING
   ========================================================= */

async function routeTo(
  coords,
  announce
){

  if(!currentPosition){

    toast(
      'GPS-Position wird noch gesucht.'
    );

    return;

  }


  const from=[

    currentPosition.lng,

    currentPosition.lat

  ];


  try{

    const url =
      OSRM+
      from.join(',')+
      ';'+
      coords.join(',')+
      '?overview=full'+
      '&geometries=geojson'+
      '&steps=true';


    const r =
      await fetch(url);


    if(!r.ok){

      throw Error(
        r.status
      );

    }


    const d =
      await r.json();


    if(!d.routes?.length){

      throw Error(
        'Keine Route'
      );

    }


    const rt =
      d.routes[0];


    if(routeLayer){

      map.removeLayer(
        routeLayer
      );

    }


    routeLayer =
      L.geoJSON(
        rt.geometry,
        {
          pane:'roadPane',

          style:{
            color:'#2563eb',
            weight:6,
            opacity:.9
          }
        }
      ).addTo(map);


    navigationActive=true;


    if(announce){

      map.fitBounds(
        routeLayer.getBounds(),
        {
          paddingTopLeft:[
            30,
            90
          ],

          paddingBottomRight:[
            30,
            150
          ],

          maxZoom:16
        }
      );

    }


    document
      .getElementById(
        'navInfo'
      )
      .classList.add(
        'show'
      );


    document
      .getElementById(
        'navMain'
      )
      .textContent =
        'Route: '+
        fmtDist(rt.distance)+
        ' • '+
        fmtTime(rt.duration);


    document
      .getElementById(
        'navSub'
      )
      .textContent =
        'Ziel wird angefahren';


    if(announce){

      speak(
        'Route berechnet. '+
        fmtDist(rt.distance)+
        ', etwa '+
        fmtTime(rt.duration)+
        '.'
      );

    }


  }catch(e){

    console.warn(
      'Route:',
      e
    );


    toast(
      'Route konnte nicht berechnet werden.'
    );

  }

}


/* =========================================================
   DISTANZ / ZEIT
   ========================================================= */

function fmtDist(m){

  return m<1000
    ? Math.round(m)+' m'
    : (m/1000).toFixed(1)+' km';

}


function fmtTime(s){

  const m =
    Math.round(
      s/60
    );


  return m<60
    ? m+' min'
    : Math.floor(m/60)+
      ' h '+
      (m%60)+
      ' min';

}


/* =========================================================
   NAVIGATION STOPPEN
   ========================================================= */

function stopNav(){

  navigationActive=false;

  destination=null;


  if(routeLayer){

    map.removeLayer(
      routeLayer
    );

  }


  routeLayer=null;


  document
    .getElementById(
      'navInfo'
    )
    .classList.remove(
      'show'
    );


  if(destMarker){

    map.removeLayer(
      destMarker
    );

    destMarker=null;

  }


  toast(
    'Navigation beendet.'
  );

}


/* =========================================================
   SPRACHE
   ========================================================= */

function speak(text){

  if(
    !voiceEnabled ||
    !window.speechSynthesis
  ){

    return;

  }


  speechSynthesis.cancel();


  const u =
    new SpeechSynthesisUtterance(
      text
    );


  u.lang='de-CH';


  speechSynthesis.speak(
    u
  );

}


function toggleVoice(){

  voiceEnabled =
    !voiceEnabled;


  const b =
    document.getElementById(
      'voiceBtn'
    );


  b.textContent =
    voiceEnabled
      ? '🔊 Sprache an'
      : '🔇 Sprache aus';


  b.classList.toggle(
    'off',
    !voiceEnabled
  );

}


/* =========================================================
   FOLLOW
   ========================================================= */

function setFollow(on){

  followEnabled=!!on;


  const b =
    document.getElementById(
      'followBtn'
    );


  b.textContent =
    followEnabled
      ? '📍 Folgen an'
      : '📍 Folgen aus';


  b.classList.toggle(
    'off',
    !followEnabled
  );


  if(
    followEnabled &&
    currentPosition
  ){

    const ll=[

      currentPosition.lat,

      currentPosition.lng

    ];


    if(
      !maurBounds ||
      maurBounds.contains(ll)
    ){

      map.setView(
        ll,
        16
      );

    }

  }

}


function toggleFollow(){

  setFollow(
    !followEnabled
  );

}


/* =========================================================
   WENN KARTE BEWEGT WIRD:
   FOLLOW AUS
   ========================================================= */

map.on(
  'dragstart',
  ()=>{

    if(
      navigationActive &&
      followEnabled
    ){

      setFollow(false);

    }

  }
);


/* =========================================================
   EIGENE PUNKTE
   ========================================================= */

function loadPoints(){

  try{

    ownPoints =
      JSON.parse(
        localStorage.getItem(
          'maurOwnPointsV16'
        ) ||
        '[]'
      );

  }catch(e){

    ownPoints=[];

  }

}


function savePoints(){

  localStorage.setItem(
    'maurOwnPointsV16',
    JSON.stringify(
      ownPoints
    )
  );

}


function addPoint(){

  if(!currentPosition){

    toast(
      'GPS wird noch gesucht.'
    );

    return;

  }


  if(
    maurBounds &&
    !maurBounds.contains([
      currentPosition.lat,
      currentPosition.lng
    ])
  ){

    toast(
      'Der Standort liegt ausserhalb Maur.'
    );

    return;

  }


  const n =
    prompt(
      'Name für den Punkt:',
      'Punkt '+
      (ownPoints.length+1)
    );


  if(!n){
    return;
  }


  ownPoints.push({

    id:Date.now(),

    name:n,

    lat:currentPosition.lat,

    lng:currentPosition.lng

  });


  savePoints();

  renderPoints();

  updatePointsList();


  toast(
    'Punkt gespeichert.'
  );

}


/* =========================================================
   PUNKTE ANZEIGEN
   ========================================================= */

function renderPoints(){

  ownMarkers.forEach(
    m=>{
      map.removeLayer(m);
    }
  );


  ownMarkers=[];


  ownPoints.forEach(
    p=>{

      if(
        maurBounds &&
        !maurBounds.contains([
          p.lat,
          p.lng
        ])
      ){

        return;

      }


      ownMarkers.push(

        L.marker([
          p.lat,
          p.lng
        ])
        .addTo(map)
        .bindTooltip(
          p.name
        )

      );

    }
  );

}


/* =========================================================
   PUNKTELISTE
   ========================================================= */

function updatePointsList(){

  const e =
    document.getElementById(
      'pointsList'
    );


  if(!ownPoints.length){

    e.innerHTML =
      '<p class="hint">Noch keine eigenen Punkte gespeichert.</p>';

    return;

  }


  e.innerHTML =
    ownPoints.map(
      p=>`

      <div class="point-item">

        <b>
          ${esc(p.name)}
        </b>

        <div class="hint">
          ${p.lat.toFixed(5)},
          ${p.lng.toFixed(5)}
        </div>

        <div class="point-actions">

          <button
            class="smallbtn primary"
            onclick="showPoint(${p.id})"
          >
            Anzeigen
          </button>

          <button
            class="smallbtn danger"
            onclick="deletePoint(${p.id})"
          >
            Löschen
          </button>

        </div>

      </div>

      `
    ).join('');

}


function showPoint(id){

  const p =
    ownPoints.find(
      x=>x.id===id
    );


  if(!p){
    return;
  }


  closePanels();


  map.setView(
    [p.lat,p.lng],
    16
  );


  toast(
    p.name
  );

}


function deletePoint(id){

  ownPoints =
    ownPoints.filter(
      x=>x.id!==id
    );


  savePoints();

  renderPoints();

  updatePointsList();

}


/* =========================================================
   PANELS
   ========================================================= */

function openPanel(id){

  document
    .querySelectorAll(
      '.panel'
    )
    .forEach(
      x=>{
        x.classList.remove(
          'open'
        );
      }
    );


  document
    .getElementById(id)
    .classList.add(
      'open'
    );


  document
    .getElementById(
      'searchWrap'
    )
    .style.display='none';

}


function closePanels(){

  document
    .querySelectorAll(
      '.panel'
    )
    .forEach(
      x=>{
        x.classList.remove(
          'open'
        );
      }
    );


  document
    .getElementById(
      'searchWrap'
    )
    .style.display='block';


  setTimeout(
    ()=>{

      map.invalidateSize({
        pan:false
      });

    },
    100
  );

}


/* =========================================================
   FEHLERMELDUNG
   ========================================================= */

function showMapMsg(t){

  const e =
    document.getElementById(
      'mapmsg'
    );


  e.textContent=t;

  e.style.display='block';


  setTimeout(
    ()=>{
      e.style.display='none';
    },
    5000
  );

}


/* =========================================================
   BUTTONS
   ========================================================= */

document.getElementById(
  'settingsBtn'
).onclick =
  ()=>openPanel(
    'settingsPanel'
  );


document.getElementById(
  'closeSettings'
).onclick =
  closePanels;


document.getElementById(
  'closePoints'
).onclick =
  closePanels;


document
  .querySelectorAll(
    '[data-view]'
  )
  .forEach(
    b=>{
      b.onclick =
        ()=>changeView(
          b.dataset.view
        );
    }
  );


document.getElementById(
  'toggleBorders'
).onchange =
  toggleBorders;


document.getElementById(
  'toggleStreetNames'
).onchange =
  toggleMapLabels;


document.getElementById(
  'toggleHouseNumbers'
).onchange =
  toggleMapLabels;


document.getElementById(
  'toggleBuildings'
).onchange =
  toggleOptional;


document.getElementById(
  'toggleRoads'
).onchange =
  toggleOptional;


document.getElementById(
  'locateBtn'
).onclick =
  ()=>{

    closePanels();

    goToLocation();

  };


document.getElementById(
  'addPointBtn'
).onclick =
  addPoint;


document.getElementById(
  'voiceBtn'
).onclick =
  toggleVoice;


document.getElementById(
  'followBtn'
).onclick =
  toggleFollow;


document.getElementById(
  'stopNavBtn'
).onclick =
  stopNav;


document.getElementById(
  'navTab'
).onclick =
  ()=>{

    closePanels();

    search.focus();

  };


document.getElementById(
  'gpsTab'
).onclick =
  ()=>{

    closePanels();

    goToLocation();

  };


document.getElementById(
  'pointsTab'
).onclick =
  ()=>{

    openPanel(
      'pointsPanel'
    );

    updatePointsList();

  };


document.getElementById(
  'mapTab'
).onclick =
  ()=>{

    closePanels();

    map.invalidateSize({
      pan:false
    });

  };


/* =========================================================
   RESIZE / ONLINE
   ========================================================= */

window.addEventListener(
  'resize',
  ()=>{

    map.invalidateSize({
      pan:false
    });

  }
);


window.addEventListener(
  'online',
  ()=>{

    status(
      'ONLINE • NUR GEMEINDE MAUR'
    );

  }
);


window.addEventListener(
  'offline',
  ()=>{

    status(
      'OFFLINE • NUR GEMEINDE MAUR'
    );

  }
);

</script>
