<!DOCTYPE html>
<html lang="de-CH">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#111827"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <title>Maur Strassendienst</title>


    <!-- PWA -->

    <link
        rel="manifest"
        href="./manifest.json"
    >


    <!-- MapLibre CSS -->

    <link
        rel="stylesheet"
        href="https://unpkg.com/maplibre-gl@5.13.0/dist/maplibre-gl.css"
    >


    <!-- MapLibre JS -->

    <script
        src="https://unpkg.com/maplibre-gl@5.13.0/dist/maplibre-gl.js"
    ></script>


    <!-- PMTiles -->

    <script
        src="https://unpkg.com/pmtiles@4.5.0/dist/pmtiles.js"
    ></script>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: #111827;

        }


        /* =========================
           KARTE
        ========================= */

        #map {

            position: absolute;

            top: 64px;

            bottom: 72px;

            left: 0;

            right: 0;

            z-index: 1;

        }


        /* =========================
           OBERE LEISTE
        ========================= */

        .topbar {

            position: absolute;

            top: 0;

            left: 0;

            right: 0;

            height: 64px;

            z-index: 1000;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 8px 14px;

            background:
                rgba(17,24,39,.97);

            color: white;

        }


        .title {

            display: flex;

            flex-direction: column;

        }


        .title strong {

            font-size: 19px;

            letter-spacing: .7px;

        }


        .title span {

            font-size: 11px;

            opacity: .7;

        }


        .iconButton {

            width: 46px;

            height: 46px;

            border: 0;

            border-radius: 50%;

            background: white;

            color: #111827;

            font-size: 21px;

        }


        /* =========================
           SUCHE
        ========================= */

        .searchBox {

            position: absolute;

            top: 74px;

            left: 10px;

            right: 10px;

            z-index: 1001;

            display: flex;

            background: white;

            border-radius: 14px;

            box-shadow:
                0 4px 20px rgba(0,0,0,.25);

            overflow: hidden;

        }


        .searchBox input {

            flex: 1;

            height: 50px;

            border: 0;

            outline: 0;

            padding: 0 14px;

            font-size: 16px;

        }


        .searchBox button {

            width: 55px;

            border: 0;

            background: white;

            font-size: 20px;

        }


        /* =========================
           SUCHERGEBNISSE
        ========================= */

        #searchResults {

            position: absolute;

            top: 130px;

            left: 10px;

            right: 10px;

            z-index: 2500;

            background: white;

            border-radius: 12px;

            overflow: hidden;

            display: none;

            box-shadow:
                0 5px 20px rgba(0,0,0,.25);

            max-height: 55vh;

            overflow-y: auto;

        }


        .result {

            padding: 14px;

            border-bottom:
                1px solid #ddd;

            cursor: pointer;

        }


        .result:last-child {

            border-bottom: 0;

        }


        .result strong {

            display: block;

            font-size: 15px;

            margin-bottom: 4px;

        }


        .result small {

            color: #666;

        }


        /* =========================
           NAVIGATION INFO OBEN
        ========================= */

        #navigationInfo {

            position: absolute;

            top: 132px;

            left: 10px;

            right: 10px;

            z-index: 1500;

            background:
                rgba(17,24,39,.96);

            color: white;

            border-radius: 16px;

            padding: 12px 14px;

            box-shadow:
                0 5px 20px rgba(0,0,0,.3);

            display: none;

        }


        #navigationInfo.active {

            display: block;

        }


        #navigationInstruction {

            font-size: 16px;

            font-weight: 700;

            margin-bottom: 8px;

        }


        .navStats {

            display: flex;

            justify-content: space-between;

            gap: 8px;

        }


        .navStat {

            flex: 1;

            background:
                rgba(255,255,255,.08);

            border-radius: 10px;

            padding: 8px;

            text-align: center;

        }


        .navStat strong {

            display: block;

            font-size: 15px;

        }


        .navStat span {

            display: block;

            font-size: 10px;

            opacity: .7;

            margin-top: 2px;

        }


        /* =========================
           UNTERE LEISTE
        ========================= */

        .bottomPanel {

            position: absolute;

            bottom: 0;

            left: 0;

            right: 0;

            height: 72px;

            z-index: 1000;

            display: flex;

            justify-content: space-around;

            align-items: center;

            background:
                rgba(17,24,39,.98);

            padding-bottom:
                env(safe-area-inset-bottom);

        }


        .bottomPanel button {

            background: transparent;

            color: white;

            border: 0;

            font-size: 22px;

            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 3px;

        }


        .bottomPanel span {

            font-size: 10px;

            opacity: .8;

        }


        /* =========================
           PANELS
        ========================= */

        .panel {

            position: absolute;

            z-index: 3000;

            left: 10px;

            right: 10px;

            bottom: 82px;

            max-height: 75vh;

            overflow-y: auto;

            background: white;

            border-radius: 18px;

            padding: 20px;

            box-shadow:
                0 8px 30px rgba(0,0,0,.35);

        }


        .hidden {

            display: none !important;

        }


        .panel h2 {

            margin-top: 0;

        }


        .panel label {

            display: block;

            padding: 14px 0;

            border-bottom:
                1px solid #eee;

            font-size: 16px;

        }


        .panel label input {

            margin-right: 10px;

            transform: scale(1.2);

        }


        .close {

            float: right;

            border: 0;

            background: #eee;

            border-radius: 50%;

            width: 34px;

            height: 34px;

            font-size: 20px;

        }


        .mainButton {

            width: 100%;

            padding: 15px;

            border: 0;

            border-radius: 12px;

            background: #111827;

            color: white;

            font-size: 16px;

            margin-top: 10px;

        }


        .successButton {

            background: #047857;

        }


        .dangerButton {

            background: #b91c1c;

        }


        .infoText {

            background: #f3f4f6;

            padding: 12px;

            border-radius: 10px;

            margin: 10px 0;

        }


        /* =========================
           GPS PUNKT
        ========================= */

        .gps-marker {

            width: 22px;

            height: 22px;

            border-radius: 50%;

            background: #2563eb;

            border: 4px solid white;

            box-shadow:

                0 0 0 5px
                rgba(37,99,235,.25),

                0 2px 8px
                rgba(0,0,0,.4);

        }


        /* =========================
           ZIEL PUNKT
        ========================= */

        .destination-marker {

            width: 30px;

            height: 30px;

            border-radius: 50%;

            background: #dc2626;

            border: 4px solid white;

            box-shadow:
                0 2px 8px rgba(0,0,0,.4);

            display: flex;

            align-items: center;

            justify-content: center;

            color: white;

            font-size: 13px;

        }


        /* =========================
           TOAST
        ========================= */

        #toast {

            position: fixed;

            left: 50%;

            bottom: 92px;

            transform:
                translateX(-50%);

            z-index: 9999;

            background:
                rgba(17,24,39,.96);

            color: white;

            padding: 11px 16px;

            border-radius: 12px;

            font-size: 14px;

            display: none;

            max-width: 90%;

            text-align: center;

        }


        /* =========================
           MAPLIBRE
        ========================= */

        .maplibregl-ctrl-bottom-right {

            bottom: 8px;

        }

    </style>

</head>


<body>


    <!-- ==================================================
         OBERE LEISTE
    ================================================== -->

    <div class="topbar">

        <div class="title">

            <strong>
                MAUR STRASSENDIENST
            </strong>

            <span id="connectionStatus">
                Online
            </span>

        </div>


        <button
            class="iconButton"
            onclick="openPanel('settingsPanel')"
        >
            ⚙️
        </button>

    </div>



    <!-- ==================================================
         SUCHE
    ================================================== -->

    <div class="searchBox">

        <input
            id="searchInput"
            type="search"
            placeholder="Ort, Strasse oder Adresse suchen..."
            autocomplete="off"
        >


        <button
            onclick="searchLocation()"
        >
            🔎
        </button>

    </div>


    <div id="searchResults"></div>



    <!-- ==================================================
         NAVIGATION INFO
    ================================================== -->

    <div id="navigationInfo">

        <div id="navigationInstruction">

            Navigation wird vorbereitet...

        </div>


        <div class="navStats">


            <div class="navStat">

                <strong
                    id="remainingDistance"
                >
                    –
                </strong>

                <span>
                    Reststrecke
                </span>

            </div>


            <div class="navStat">

                <strong
                    id="remainingTime"
                >
                    –
                </strong>

                <span>
                    Restzeit
                </span>

            </div>


            <div class="navStat">

                <strong
                    id="gpsAccuracy"
                >
                    –
                </strong>

                <span>
                    GPS
                </span>

            </div>


        </div>

    </div>



    <!-- ==================================================
         KARTE
    ================================================== -->

    <div id="map"></div>



    <!-- ==================================================
         NAVIGATION PANEL
    ================================================== -->

    <div
        id="navigationPanel"
        class="panel hidden"
    >


        <button
            class="close"
            onclick="closePanel('navigationPanel')"
        >
            ×
        </button>


        <h2>
            🧭 Navigation
        </h2>


        <div class="infoText">

            <strong>
                🏁 Ziel
            </strong>

            <div
                id="navigationDestination"
            >
                Noch kein Ziel ausgewählt.
            </div>

        </div>


        <div class="infoText">

            <strong>
                📍 Standort
            </strong>

            <div id="gpsStatus">

                GPS wird noch nicht verwendet.

            </div>

        </div>


        <label>

            <input
                type="checkbox"
                id="voiceNavigation"
                checked
                onchange="toggleVoice(this.checked)"
            >

            🔊 Sprachansagen

        </label>


        <label>

            <input
                type="checkbox"
                id="followNavigation"
                checked
                onchange="toggleNavigationFollow(this.checked)"
            >

            🧭 Karte automatisch folgen

        </label>


        <button
            class="mainButton successButton"
            onclick="startNavigation()"
        >
            🧭 Navigation starten
        </button>


        <button
            class="mainButton"
            onclick="recenterNavigation()"
        >
            📍 Zu meiner Position
        </button>


        <button
            class="mainButton dangerButton"
            onclick="stopNavigation()"
        >
            🛑 Navigation beenden
        </button>


    </div>



    <!-- ==================================================
         EINSTELLUNGEN
    ================================================== -->

    <div
        id="settingsPanel"
        class="panel hidden"
    >


        <button
            class="close"
            onclick="closePanel('settingsPanel')"
        >
            ×
        </button>


        <h2>
            ⚙️ Einstellungen
        </h2>


        <label>

            <input
                type="radio"
                name="mapView"
                value="normal"
                checked
                onchange="changeView('normal')"
            >

            🗺️ Normale Karte

        </label>


        <label>

            <input
                type="radio"
                name="mapView"
                value="satellite"
                onchange="changeView('satellite')"
            >

            🛰️ Satellit

        </label>


        <label>

            <input
                type="radio"
                name="mapView"
                value="hybrid"
                onchange="changeView('hybrid')"
            >

            🔀 Hybrid

        </label>


        <label>

            <input
                type="checkbox"
                id="ortsgrenzen"
                checked
                onchange="toggleOrtsgrenzen(this.checked)"
            >

            🔴 Ortschaftsgrenzen

        </label>


        <label>

            <input
                type="checkbox"
                id="buildings"
                checked
                onchange="toggleLayer('buildings', this.checked)"
            >

            🏠 Gebäude

        </label>


        <label>

            <input
                type="checkbox"
                id="roads"
                checked
                onchange="toggleLayer('roads', this.checked)"
            >

            🛣️ Strassen

        </label>


        <label>

            <input
                type="checkbox"
                id="streetLabels"
                checked
                onchange="toggleLayer('street-labels', this.checked)"
            >

            🏷️ Strassennamen

        </label>


        <button
            class="mainButton"
            onclick="openNavigationPanel()"
        >
            🧭 Navigation öffnen
        </button>


    </div>



    <!-- ==================================================
         EIGENE PUNKTE
    ================================================== -->

    <div
        id="pointsPanel"
        class="panel hidden"
    >


        <button
            class="close"
            onclick="closePanel('pointsPanel')"
        >
            ×
        </button>


        <h2>
            📌 Eigene Punkte
        </h2>


        <button
            class="mainButton"
            onclick="addOwnPoint()"
        >
            📍 Punkt an meiner Position speichern
        </button>


        <div id="ownPointsList"></div>


    </div>



    <!-- ==================================================
         UNTERE NAVIGATION
    ================================================== -->

    <div class="bottomPanel">


        <button
            onclick="openNavigationPanel()"
        >

            🧭

            <span>
                Navi
            </span>

        </button>


        <button
            onclick="goToLocation()"
        >

            📍

            <span>
                GPS
            </span>

        </button>


        <button
            onclick="openPanel('pointsPanel')"
        >

            📌

            <span>
                Punkte
            </span>

        </button>


        <button
            onclick="openPanel('settingsPanel')"
        >

            ⚙️

            <span>
                Karte
            </span>

        </button>


    </div>



    <!-- ==================================================
         TOAST
    ================================================== -->

    <div id="toast"></div>



    <!-- ==================================================
         APP.JS
    ================================================== -->

    <script src="./app.js"></script>


</body>

</html>
