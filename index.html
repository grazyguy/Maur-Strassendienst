<!DOCTYPE html>
<html lang="de">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               viewport-fit=cover">

<meta name="theme-color" content="#111827">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style"
      content="black-translucent">

<title>Maur Strassendienst</title>

<link rel="manifest" href="./manifest.json">

<link rel="stylesheet"
      href="https://unpkg.com/maplibre-gl@5.13.0/dist/maplibre-gl.css">

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    background: #eef2f7;
}

#app {
    position: relative;
    width: 100%;
    height: 100%;
}

#map {
    position: absolute;
    inset: 0;
}


/* =========================
   HEADER
========================= */

header {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;

    z-index: 1000;

    padding: 12px;
    padding-top:
        calc(12px + env(safe-area-inset-top));

    background: rgba(17,24,39,.96);

    color: white;

    box-shadow:
        0 2px 10px rgba(0,0,0,.25);
}

.header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo {
    font-size: 21px;
    font-weight: 800;
    letter-spacing: .5px;
}

.subtitle {
    font-size: 12px;
    opacity: .75;
}

.status {
    padding: 6px 9px;
    border-radius: 20px;
    font-size: 12px;
    background: #166534;
}


/* =========================
   SEARCH
========================= */

.search {
    display: flex;
    gap: 7px;
    margin-top: 10px;
}

.search input {
    flex: 1;
    min-width: 0;

    border: 0;
    border-radius: 10px;

    padding: 12px;

    font-size: 15px;
    outline: none;
}

.search button {
    border: 0;
    border-radius: 10px;

    padding: 11px 14px;

    background: white;
    color: #111827;

    font-weight: 700;
}


/* =========================
   BOTTOM BAR
========================= */

.bottom-bar {
    position: absolute;

    left: 10px;
    right: 10px;

    bottom:
        calc(10px + env(safe-area-inset-bottom));

    z-index: 1000;

    display: grid;

    grid-template-columns:
        repeat(5,1fr);

    gap: 6px;
}

.bottom-bar button {
    border: 0;
    border-radius: 11px;

    background:
        rgba(17,24,39,.96);

    color: white;

    padding: 11px 3px;

    font-size: 12px;
    font-weight: 700;

    box-shadow:
        0 3px 10px rgba(0,0,0,.25);
}


/* =========================
   PANELS
========================= */

.panel {

    display: none;

    position: absolute;

    left: 10px;
    right: 10px;

    bottom:
        calc(76px + env(safe-area-inset-bottom));

    z-index: 2000;

    background: white;

    border-radius: 16px;

    padding: 16px;

    box-shadow:
        0 8px 30px rgba(0,0,0,.35);

    max-height: 70vh;

    overflow-y: auto;
}

.panel.active {
    display: block;
}

.panel h2 {
    margin: 0 0 12px;
    font-size: 19px;
}

.panel-row {

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 10px 0;

    border-bottom:
        1px solid #e5e7eb;
}

.panel-row:last-child {
    border-bottom: 0;
}

.panel input[type="checkbox"] {
    width: 20px;
    height: 20px;
}

.panel button {

    width: 100%;

    margin-top: 10px;

    border: 0;

    border-radius: 10px;

    padding: 12px;

    font-weight: 700;
}

.blue {
    background: #2563eb;
    color: white;
}

.close {
    background: #111827;
    color: white;
}


/* =========================
   VIEW BUTTONS
========================= */

.view-button {

    display: flex;

    align-items: center;

    justify-content: space-between;

    width: 100%;

    margin: 7px 0;

    padding: 14px;

    border: 0;

    border-radius: 12px;

    background: #f3f4f6;

    color: #111827;

    font-size: 15px;

    font-weight: 700;

    text-align: left;
}

.view-button.active {
    background: #2563eb;
    color: white;
}


/* =========================
   TOAST
========================= */

.toast {

    display: none;

    position: absolute;

    left: 50%;

    bottom:
        calc(90px + env(safe-area-inset-bottom));

    transform:
        translateX(-50%);

    z-index: 3000;

    background: #111827;

    color: white;

    padding: 10px 15px;

    border-radius: 20px;

    font-size: 13px;

    white-space: nowrap;

    box-shadow:
        0 4px 15px rgba(0,0,0,.3);
}


/* =========================
   MARKER
========================= */

.gps-marker {

    width: 22px;
    height: 22px;

    background: #2563eb;

    border: 4px solid white;

    border-radius: 50%;

    box-shadow:
        0 2px 8px rgba(0,0,0,.5);
}

.own-marker {

    width: 31px;
    height: 31px;

    background: #111827;

    color: white;

    border-radius: 50%;

    display: flex;

    align-items: center;
    justify-content: center;

    border: 3px solid white;

    box-shadow:
        0 2px 8px rgba(0,0,0,.4);
}


/* =========================
   MAP CONTROLS
========================= */

.maplibregl-ctrl-top-right {
    top: 145px;
}

</style>

</head>


<body>

<div id="app">


<header>

    <div class="header-top">

        <div>

            <div class="logo">
                MAUR
            </div>

            <div class="subtitle">
                Strassendienst
            </div>

        </div>

        <div id="connectionStatus"
             class="status">

            ● Online

        </div>

    </div>


    <div class="search">

        <input
            id="searchInput"
            type="text"
            placeholder="Adresse oder Ort suchen..."
        >

        <button onclick="searchAddress()">
            Suchen
        </button>

    </div>

</header>


<div id="map"></div>


<!-- =====================
     EBENEN
===================== -->

<div id="layersPanel"
     class="panel">

    <h2>Ebenen</h2>


    <div class="panel-row">

        <span>Strassen</span>

        <input
            id="roadsCheck"
            type="checkbox"
            checked
            onchange="toggleLayer('roads', this.checked)"
        >

    </div>


    <div class="panel-row">

        <span>Gebäude</span>

        <input
            id="buildingsCheck"
            type="checkbox"
            checked
            onchange="toggleLayer('buildings', this.checked)"
        >

    </div>


    <div class="panel-row">

        <span>Landschaft</span>

        <input
            id="landCheck"
            type="checkbox"
            checked
            onchange="toggleLayer('land', this.checked)"
        >

    </div>


    <div class="panel-row">

        <span>Wasser</span>

        <input
            id="waterCheck"
            type="checkbox"
            checked
            onchange="toggleLayer('water', this.checked)"
        >

    </div>


    <div class="panel-row">

        <span>Eigene Punkte</span>

        <input
            id="ownCheck"
            type="checkbox"
            checked
            onchange="toggleOwnPoints(this.checked)"
        >

    </div>


    <button
        class="close"
        onclick="closePanels()">

        Schliessen

    </button>

</div>


<!-- =====================
     ANSICHT
===================== -->

<div id="viewPanel"
     class="panel">

    <h2>🗺️ Kartenansicht</h2>


    <button
        id="normalViewButton"
        class="view-button active"
        onclick="changeView('normal')">

        <span>🗺️ Karte</span>

        <span>✓</span>

    </button>


    <button
        id="satelliteViewButton"
        class="view-button"
        onclick="changeView('satellite')">

        <span>🛰️ Satellit</span>

        <span></span>

    </button>


    <button
        id="hybridViewButton"
        class="view-button"
        onclick="changeView('hybrid')">

        <span>🗺️🛰️ Hybrid</span>

        <span></span>

    </button>


    <button
        class="close"
        onclick="closePanels()">

        Schliessen

    </button>

</div>


<!-- =====================
     NAVIGATION
===================== -->

<div id="navPanel"
     class="panel">

    <h2>Navigation</h2>

    <p>
        <b>Ziel:</b>
    </p>

    <div id="destinationText">

        Noch kein Ziel ausgewählt.

    </div>


    <button
        class="blue"
        onclick="useCurrentLocationAsStart()">

        📍 Aktuellen Standort verwenden

    </button>


    <button
        class="blue"
        onclick="openGoogleMaps()">

        🧭 Navigation starten

    </button>


    <button
        class="close"
        onclick="closePanels()">

        Schliessen

    </button>

</div>


<!-- =====================
     EIGENER PUNKT
===================== -->

<div id="pointPanel"
     class="panel">

    <h2>Eigenen Punkt setzen</h2>

    <p>
        Setze einen Punkt direkt
        auf der Karte.
    </p>


    <button
        class="blue"
        onclick="startAddPoint()">

        📍 Punkt auf Karte setzen

    </button>


    <button
        class="close"
        onclick="closePanels()">

        Abbrechen

    </button>

</div>


<div id="toast"
     class="toast">
</div>


<!-- =====================
     BOTTOM BAR
===================== -->

<div class="bottom-bar">

    <button onclick="goToLocation()">
        📍<br>
        Standort
    </button>


    <button onclick="openLayers()">
        ☰<br>
        Ebenen
    </button>


    <button onclick="openViewPanel()">
        🗺️<br>
        Ansicht
    </button>


    <button onclick="openNavigation()">
        🧭<br>
        Navi
    </button>


    <button onclick="openPointPanel()">
        ➕<br>
        Punkt
    </button>

</div>


</div>


<!-- =========================
     LIBRARIES
========================= -->

<script
    src="https://unpkg.com/maplibre-gl@5.13.0/dist/maplibre-gl.js">
</script>

<script
    src="https://unpkg.com/pmtiles@4.5.0/dist/pmtiles.js">
</script>


<script>

/* =========================
   PMTILES
========================= */

const protocol =
    new pmtiles.Protocol();

maplibregl.addProtocol(
    "pmtiles",
    protocol.tile
);

const PMTILES_URL =
    "./maur.pmtiles";

const pmtilesArchive =
    new pmtiles.PMTiles(
        PMTILES_URL
    );

protocol.add(
    pmtilesArchive
);


/* =========================
   VARIABLEN
========================= */

let map;

let gpsMarker = null;

let ownMarkers = [];

let addingPoint = false;

let currentDestination = null;

let currentView = "normal";


/* =========================
   MAP START
========================= */

pmtilesArchive
.getHeader()
.then(header => {

    const centerLon =
        header.centerLon || 8.667;

    const centerLat =
        header.centerLat || 47.337;


    map =
        new maplibregl.Map({

            container: "map",

            center: [
                centerLon,
                centerLat
            ],

            zoom: 13,

            minZoom: 8,

            maxZoom: 19,


            style: {

                version: 8,

                glyphs:
                    "https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf",


                sources: {

                    maur: {

                        type: "vector",

                        url:
                            "pmtiles://" +
                            PMTILES_URL,

                        attribution:
                            "© OpenStreetMap contributors"

                    },


                    satellite: {

                        type: "raster",

                        tiles: [

                            "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"

                        ],

                        tileSize: 256,

                        maxzoom: 19,

                        attribution:
                            "© Esri"

                    }

                },


                layers: [


                    /* =================
                       SATELLIT
                    ================= */

                    {

                        id: "satellite",

                        type: "raster",

                        source: "satellite",

                        layout: {

                            visibility:
                                "none"

                        }

                    },


                    /* =================
                       HINTERGRUND
                    ================= */

                    {

                        id: "background",

                        type: "background",

                        paint: {

                            "background-color":
                                "#f1f3f5"

                        }

                    },


                    /* =================
                       LAND
                    ================= */

                    {

                        id: "land",

                        type: "fill",

                        source: "maur",

                        "source-layer":
                            "land",

                        paint: {

                            "fill-color":

                                [

                                    "match",

                                    [
                                        "get",
                                        "kind"
                                    ],

                                    "forest",
                                    "#c8dfc0",

                                    "grass",
                                    "#dcebd4",

                                    "meadow",
                                    "#e2efd7",

                                    "orchard",
                                    "#d7e7c5",

                                    "vineyard",
                                    "#dce6c5",

                                    "#e7eadf"

                                ]

                        }

                    },


                    /* =================
                       SITES
                    ================= */

                    {

                        id: "sites",

                        type: "fill",

                        source: "maur",

                        "source-layer":
                            "sites",

                        paint: {

                            "fill-color":
                                "#e3e8dc",

                            "fill-opacity":
                                0.75

                        }

                    },


                    /* =================
                       WASSER
                    ================= */

                    {

                        id: "water",

                        type: "fill",

                        source: "maur",

                        "source-layer":
                            "water_polygons",

                        paint: {

                            "fill-color":
                                "#9ecae1"

                        }

                    },


                    /* =================
                       WASSERLINIEN
                    ================= */

                    {

                        id: "water-lines",

                        type: "line",

                        source: "maur",

                        "source-layer":
                            "water_lines",

                        paint: {

                            "line-color":
                                "#7db7d8",

                            "line-width": 1.5

                        }

                    },


                    /* =================
                       GEBÄUDE
                    ================= */

                    {

                        id: "buildings",

                        type: "fill",

                        source: "maur",

                        "source-layer":
                            "buildings",

                        paint: {

                            "fill-color":
                                "#d7d2c8",

                            "fill-opacity":
                                0.85

                        }

                    },


                    /* =================
                       STRASSEN
                    ================= */

                    {

                        id: "roads",

                        type: "line",

                        source: "maur",

                        "source-layer":
                            "streets",

                        paint: {

                            "line-color":

                                [

                                    "match",

                                    [
                                        "get",
                                        "kind"
                                    ],

                                    "motorway",
                                    "#e89292",

                                    "trunk",
                                    "#efa6a6",

                                    "primary",
                                    "#f0b36d",

                                    "secondary",
                                    "#f4d18c",

                                    "tertiary",
                                    "#ffffff",

                                    "residential",
                                    "#ffffff",

                                    "service",
                                    "#eeeeee",

                                    "track",
                                    "#d3c3a5",

                                    "path",
                                    "#c6b79f",

                                    "#ffffff"

                                ],

                            "line-width":

                                [

                                    "interpolate",

                                    [
                                        "linear"
                                    ],

                                    [
                                        "zoom"
                                    ],

                                    10,
                                    1,

                                    13,
                                    2,

                                    16,
                                    4,

                                    19,
                                    8

                                ]

                        }

                    },


                    /* =================
                       STRASSENLABEL
                    ================= */

                    {

                        id: "street-labels",

                        type: "symbol",

                        source: "maur",

                        "source-layer":
                            "street_labels",

                        layout: {

                            "text-field":
                                [
                                    "coalesce",
                                    [
                                        "get",
                                        "name"
                                    ],
                                    [
                                        "get",
                                        "ref"
                                    ]
                                ],

                            "text-size":

                                [

                                    "interpolate",

                                    [
                                        "linear"
                                    ],

                                    [
                                        "zoom"
                                    ],

                                    10,
                                    10,

                                    14,
                                    12,

                                    18,
                                    15

                                ],

                            "text-font": [
                                "Noto Sans Regular"
                            ]

                        },

                        paint: {

                            "text-color":
                                "#333333",

                            "text-halo-color":
                                "#ffffff",

                            "text-halo-width":
                                1.5

                        }

                    },


                    /* =================
                       ORTS / ADRESSEN
                    ================= */

                    {

                        id: "addresses",

                        type: "symbol",

                        source: "maur",

                        "source-layer":
                            "addresses",

                        minzoom: 16,

                        layout: {

                            "text-field":
                                [
                                    "coalesce",
                                    [
                                        "get",
                                        "housenumber"
                                    ],
                                    ""
                                ],

                            "text-size": 11,

                            "text-font": [
                                "Noto Sans Regular"
                            ]

                        },

                        paint: {

                            "text-color":
                                "#555555",

                            "text-halo-color":
                                "#ffffff",

                            "text-halo-width":
                                1

                        }

                    }

                ]

            }

        });


    map.addControl(
        new maplibregl.NavigationControl(),
        "top-right"
    );


    map.on("click", function(e) {

        if (!addingPoint) {
            return;
        }

        addOwnPoint(
            e.lngLat.lng,
            e.lngLat.lat
        );

        addingPoint = false;

        closePanels();

        showToast(
            "Punkt gespeichert"
        );

    });


    loadOwnPoints();

});


/* =========================
   ANSICHT WECHSELN
========================= */

function changeView(view) {

    if (!map) {
        return;
    }

    currentView = view;


    const satelliteVisible =
        view === "satellite" ||
        view === "hybrid";


    map.setLayoutProperty(
        "satellite",
        "visibility",
        satelliteVisible
            ? "visible"
            : "none"
    );


    /* Normale Kartenelemente */

    const normalLayers = [

        "background",
        "land",
        "sites",
        "water",
        "water-lines",
        "buildings"

    ];


    normalLayers.forEach(
        layer => {

            if (!map.getLayer(layer)) {
                return;
            }

            map.setLayoutProperty(

                layer,

                "visibility",

                view === "normal"
                    ? "visible"
                    : "none"

            );

        }
    );


    /* Strassen */

    if (map.getLayer("roads")) {

        map.setLayoutProperty(

            "roads",

            "visibility",

            view === "satellite"
                ? "none"
                : "visible"

        );

    }


    /* Hybrid und normale Karte
       zeigen Strassennamen */

    if (map.getLayer("street-labels")) {

        map.setLayoutProperty(

            "street-labels",

            "visibility",

            "visible"

        );

    }


    if (map.getLayer("addresses")) {

        map.setLayoutProperty(

            "addresses",

            "visibility",

            "visible"

        );

    }


    document
        .querySelectorAll(".view-button")
        .forEach(button => {

            button.classList.remove(
                "active"
            );

        });


    if (view === "normal") {

        document
            .getElementById(
                "normalViewButton"
            )
            .classList.add("active");

    }


    if (view === "satellite") {

        document
            .getElementById(
                "satelliteViewButton"
            )
            .classList.add("active");

    }


    if (view === "hybrid") {

        document
            .getElementById(
                "hybridViewButton"
            )
            .classList.add("active");

    }


    showToast(

        view === "normal"
            ? "Karte"
            : view === "satellite"
                ? "Satellit"
                : "Hybrid"

    );

}


/* =========================
   PANELS
========================= */

function closePanels() {

    document
        .querySelectorAll(".panel")
        .forEach(panel => {

            panel.classList.remove(
                "active"
            );

        });

}


function openLayers() {

    closePanels();

    document
        .getElementById(
            "layersPanel"
        )
        .classList.add("active");

}


function openViewPanel() {

    closePanels();

    document
        .getElementById(
            "viewPanel"
        )
        .classList.add("active");

}


function openNavigation() {

    closePanels();

    document
        .getElementById(
            "navPanel"
        )
        .classList.add("active");

}


function openPointPanel() {

    closePanels();

    document
        .getElementById(
            "pointPanel"
        )
        .classList.add("active");

}


/* =========================
   LAYER
========================= */

function toggleLayer(
    type,
    enabled
) {

    if (!map) {
        return;
    }

    const layer =
        map.getLayer(type);

    if (!layer) {
        return;
    }

    map.setLayoutProperty(

        type,

        "visibility",

        enabled
            ? "visible"
            : "none"

    );

}


/* =========================
   GPS
========================= */

function goToLocation() {

    if (!navigator.geolocation) {

        showToast(
            "GPS wird nicht unterstützt"
        );

        return;

    }


    navigator.geolocation.getCurrentPosition(

        position => {

            const lat =
                position.coords.latitude;

            const lon =
                position.coords.longitude;


            map.flyTo({

                center: [
                    lon,
                    lat
                ],

                zoom: 17,

                speed: 1.2

            });


            if (gpsMarker) {

                gpsMarker.remove();

            }


            const el =
                document.createElement(
                    "div"
                );

            el.className =
                "gps-marker";


            gpsMarker =
                new maplibregl.Marker(el)

                    .setLngLat([
                        lon,
                        lat
                    ])

                    .addTo(map);


            showToast(
                "Standort gefunden"
            );

        },

        () => {

            showToast(
                "GPS konnte nicht gefunden werden"
            );

        },

        {

            enableHighAccuracy:
                true,

            timeout:
                10000,

            maximumAge:
                5000

        }

    );

}


/* =========================
   SUCHE
========================= */

async function searchAddress() {

    const input =
        document.getElementById(
            "searchInput"
        );

    const query =
        input.value.trim();


    if (!query) {
        return;
    }


    showToast(
        "Suche..."
    );


    try {

        const url =
            "https://nominatim.openstreetmap.org/search" +
            "?format=json" +
            "&limit=1" +
            "&countrycodes=ch" +
            "&q=" +
            encodeURIComponent(query);


        const response =
            await fetch(url);


        const data =
            await response.json();


        if (!data.length) {

            showToast(
                "Kein Treffer"
            );

            return;

        }


        const lat =
            parseFloat(data[0].lat);

        const lon =
            parseFloat(data[0].lon);


        map.flyTo({

            center: [
                lon,
                lat
            ],

            zoom: 17,

            speed: 1.2

        });


        currentDestination = {

            lat: lat,

            lon: lon,

            name:
                data[0].display_name

        };


        document
            .getElementById(
                "destinationText"
            )
            .innerText =
                data[0].display_name;


        showToast(
            "Ziel gefunden"
        );


    } catch (error) {

        showToast(
            "Suche nicht verfügbar"
        );

    }

}


/* =========================
   NAVIGATION
========================= */

function useCurrentLocationAsStart() {

    goToLocation();

}


function openGoogleMaps() {

    if (!currentDestination) {

        showToast(
            "Zuerst ein Ziel suchen"
        );

        return;

    }


    const url =
        "https://www.google.com/maps/dir/?api=1" +
        "&destination=" +
        currentDestination.lat +
        "," +
        currentDestination.lon;


    window.open(
        url,
        "_blank"
    );

}


/* =========================
   EIGENE PUNKTE
========================= */

function startAddPoint() {

    addingPoint = true;

    closePanels();

    showToast(
        "Jetzt auf die Karte tippen"
    );

}


function addOwnPoint(
    lon,
    lat
) {

    const el =
        document.createElement(
            "div"
        );

    el.className =
        "own-marker";

    el.innerHTML =
        "📍";


    const marker =
        new maplibregl.Marker(el)

            .setLngLat([
                lon,
                lat
            ])

            .addTo(map);


    ownMarkers.push(marker);


    const saved =
        JSON.parse(
            localStorage.getItem(
                "maurOwnPoints"
            ) || "[]"
        );


    saved.push({

        lon: lon,

        lat: lat

    });


    localStorage.setItem(

        "maurOwnPoints",

        JSON.stringify(saved)

    );

}


function loadOwnPoints() {

    const saved =
        JSON.parse(
            localStorage.getItem(
                "maurOwnPoints"
            ) || "[]"
        );


    saved.forEach(point => {

        const el =
            document.createElement(
                "div"
            );

        el.className =
            "own-marker";

        el.innerHTML =
            "📍";


        const marker =
            new maplibregl.Marker(el)

                .setLngLat([
                    point.lon,
                    point.lat
                ])

                .addTo(map);


        ownMarkers.push(
            marker
        );

    });

}


function toggleOwnPoints(
    enabled
) {

    ownMarkers.forEach(
        marker => {

            marker
                .getElement()
                .style.display =
                    enabled
                        ? "flex"
                        : "none";

        }
    );

}


/* =========================
   TOAST
========================= */

function showToast(
    message
) {

    const toast =
        document.getElementById(
            "toast"
        );


    toast.innerText =
        message;


    toast.style.display =
        "block";


    clearTimeout(
        window.toastTimer
    );


    window.toastTimer =
        setTimeout(() => {

            toast.style.display =
                "none";

        }, 2200);

}


/* =========================
   ONLINE STATUS
========================= */

function updateConnectionStatus() {

    const status =
        document.getElementById(
            "connectionStatus"
        );


    if (navigator.onLine) {

        status.innerText =
            "● Online";

        status.style.background =
            "#166534";

    } else {

        status.innerText =
            "● Offline";

        status.style.background =
            "#991b1b";

    }

}


window.addEventListener(
    "online",
    updateConnectionStatus
);

window.addEventListener(
    "offline",
    updateConnectionStatus
);

updateConnectionStatus();


</script>
