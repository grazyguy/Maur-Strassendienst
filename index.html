<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<meta name="theme-color" content="#111827">

<title>Maur Strassendienst</title>

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #111827;
    color: white;
}

#app {
    width: 100%;
    height: 100%;
    position: relative;
}

/* =========================
   TOPBAR
========================= */

.topbar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 64px;
    z-index: 2000;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 8px 12px;

    background: rgba(17, 24, 39, 0.96);
    backdrop-filter: blur(12px);

    box-shadow: 0 2px 12px rgba(0,0,0,0.3);
}

.logo {
    display: flex;
    flex-direction: column;
    line-height: 1;
}

.logo-main {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 1px;
}

.logo-sub {
    font-size: 11px;
    color: #9ca3af;
    margin-top: 4px;
}

.status {
    font-size: 11px;
    padding: 6px 9px;
    border-radius: 20px;
    background: #374151;
}

.status.online {
    background: #065f46;
}

.status.offline {
    background: #7f1d1d;
}

/* =========================
   SEARCH
========================= */

.search-container {
    position: absolute;
    top: 74px;
    left: 10px;
    right: 10px;
    z-index: 1500;
}

.search-box {
    display: flex;
    gap: 6px;
}

.search-input {
    flex: 1;
    height: 46px;

    border: none;
    border-radius: 12px;

    padding: 0 14px;

    font-size: 16px;
    outline: none;

    background: white;
    color: #111827;

    box-shadow: 0 3px 15px rgba(0,0,0,0.25);
}

.search-button {
    width: 48px;
    border: none;
    border-radius: 12px;

    background: #2563eb;
    color: white;

    font-size: 20px;
    font-weight: bold;

    box-shadow: 0 3px 15px rgba(0,0,0,0.25);
}

.search-results {
    margin-top: 6px;
    background: white;
    color: #111827;
    border-radius: 12px;
    overflow: hidden;
    display: none;

    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
}

.search-result {
    padding: 13px 14px;
    border-bottom: 1px solid #e5e7eb;
    font-size: 14px;
}

.search-result:last-child {
    border-bottom: none;
}

/* =========================
   MAP
========================= */

#map {
    position: absolute;
    top: 64px;
    left: 0;
    right: 0;
    bottom: 72px;
    z-index: 1;
}

.leaflet-control-zoom {
    margin-top: 135px !important;
}

.leaflet-control-attribution {
    font-size: 9px;
}

/* =========================
   BOTTOM BAR
========================= */

.bottom-bar {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;

    height: 72px;

    z-index: 2000;

    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;

    padding: 7px;

    background: rgba(17, 24, 39, 0.97);
    backdrop-filter: blur(12px);
}

.bottom-button {
    border: none;
    border-radius: 12px;

    background: #1f2937;
    color: white;

    font-size: 11px;
    font-weight: 600;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    gap: 3px;
}

.bottom-button .icon {
    font-size: 22px;
}

.bottom-button:active {
    transform: scale(0.96);
    background: #374151;
}

/* =========================
   PANELS
========================= */

.panel {
    position: absolute;

    left: 10px;
    right: 10px;

    bottom: 82px;

    z-index: 2100;

    background: rgba(17, 24, 39, 0.98);

    border-radius: 16px;

    padding: 16px;

    box-shadow: 0 5px 25px rgba(0,0,0,0.45);

    display: none;

    max-height: 70vh;
    overflow-y: auto;
}

.panel h2 {
    margin: 0 0 14px 0;
    font-size: 18px;
}

.close-button {
    float: right;

    border: none;

    width: 34px;
    height: 34px;

    border-radius: 50%;

    background: #374151;
    color: white;

    font-size: 18px;
}

/* =========================
   LAYERS
========================= */

.layer-item {
    display: flex;
    align-items: center;

    padding: 13px 4px;

    border-bottom: 1px solid #374151;

    font-size: 15px;
}

.layer-item input {
    width: 20px;
    height: 20px;
    margin-right: 12px;
}

/* =========================
   INFO
========================= */

.info-card {
    background: #1f2937;
    border-radius: 12px;
    padding: 13px;
    margin-bottom: 10px;
}

.info-title {
    font-weight: 700;
    font-size: 16px;
}

.info-text {
    color: #d1d5db;
    font-size: 13px;
    margin-top: 5px;
}

.action-button {
    width: 100%;
    height: 46px;

    border: none;
    border-radius: 10px;

    background: #2563eb;
    color: white;

    font-size: 15px;
    font-weight: 700;

    margin-top: 8px;
}

.action-button.green {
    background: #059669;
}

.action-button.red {
    background: #dc2626;
}

/* =========================
   TOAST
========================= */

.toast {
    position: absolute;

    left: 50%;
    bottom: 88px;

    transform: translateX(-50%);

    z-index: 3000;

    background: #111827;
    color: white;

    padding: 11px 16px;

    border-radius: 10px;

    font-size: 13px;

    box-shadow: 0 4px 18px rgba(0,0,0,0.4);

    display: none;

    white-space: nowrap;
}

/* =========================
   POPUP
========================= */

.leaflet-popup-content {
    margin: 13px;
}

.popup-title {
    font-weight: 800;
    font-size: 16px;
}

.popup-text {
    margin-top: 5px;
    font-size: 13px;
}

/* =========================
   MOBILE
========================= */

@media (min-width: 700px) {

    .search-container {
        max-width: 550px;
        left: 20px;
    }

    .panel {
        left: auto;
        width: 390px;
        right: 20px;
    }

}

</style>
</head>

<body>

<div id="app">

    <!-- TOPBAR -->

    <div class="topbar">

        <div class="logo">
            <div class="logo-main">MAUR</div>
            <div class="logo-sub">STRASSENDIENST</div>
        </div>

        <div id="connectionStatus" class="status">
            Prüfe Verbindung...
        </div>

    </div>


    <!-- SEARCH -->

    <div class="search-container">

        <div class="search-box">

            <input
                id="searchInput"
                class="search-input"
                type="search"
                placeholder="Adresse, Strasse oder Ort suchen..."
                autocomplete="off"
            >

            <button
                id="searchButton"
                class="search-button"
            >
                🔎
            </button>

        </div>

        <div id="searchResults" class="search-results"></div>

    </div>


    <!-- MAP -->

    <div id="map"></div>


    <!-- BOTTOM BAR -->

    <div class="bottom-bar">

        <button
            class="bottom-button"
            onclick="goToLocation()"
        >
            <span class="icon">📍</span>
            Standort
        </button>

        <button
            class="bottom-button"
            onclick="openLayers()"
        >
            <span class="icon">🗺️</span>
            Ebenen
        </button>

        <button
            class="bottom-button"
            onclick="openNavigation()"
        >
            <span class="icon">🧭</span>
            Navi
        </button>

        <button
            class="bottom-button"
            onclick="startAddPoint()"
        >
            <span class="icon">📌</span>
            Punkt
        </button>

    </div>


    <!-- LAYERS PANEL -->

    <div
        id="layersPanel"
        class="panel"
    >

        <button
            class="close-button"
            onclick="closePanels()"
        >
            ×
        </button>

        <h2>Kartenebenen</h2>

        <label class="layer-item">
            <input
                type="checkbox"
                id="layerRoads"
                checked
                onchange="toggleLayer('roads')"
            >
            🛣️ Strassen
        </label>

        <label class="layer-item">
            <input
                type="checkbox"
                id="layerBins"
                onchange="toggleLayer('bins')"
            >
            🗑️ Abfallkübel
        </label>

        <label class="layer-item">
            <input
                type="checkbox"
                id="layerWinter"
                onchange="toggleLayer('winter')"
            >
            ❄️ Winterdienst
        </label>

        <label class="layer-item">
            <input
                type="checkbox"
                id="layerSpecial"
                onchange="toggleLayer('special')"
            >
            📌 Sonderpunkte
        </label>

        <label class="layer-item">
            <input
                type="checkbox"
                id="layerProperties"
                onchange="toggleLayer('properties')"
            >
            🏢 Gemeindeliegenschaften
        </label>

        <label class="layer-item">
            <input
                type="checkbox"
                id="layerOwn"
                checked
                onchange="toggleLayer('own')"
            >
            ⭐ Eigene Punkte
        </label>

    </div>


    <!-- INFO PANEL -->

    <div
        id="infoPanel"
        class="panel"
    >

        <button
            class="close-button"
            onclick="closePanels()"
        >
            ×
        </button>

        <h2 id="infoTitle">
            Information
        </h2>

        <div
            id="infoContent"
        >
            Wähle einen Punkt auf der Karte.
        </div>

    </div>


    <!-- NAVIGATION PANEL -->

    <div
        id="navigationPanel"
        class="panel"
    >

        <button
            class="close-button"
            onclick="closePanels()"
        >
            ×
        </button>

        <h2>Navigation</h2>

        <div class="info-card">

            <div class="info-title">
                Ziel auswählen
            </div>

            <div class="info-text">
                Tippe auf einen Punkt auf der Karte oder suche zuerst eine Adresse.
            </div>

        </div>

        <button
            class="action-button"
            onclick="useCurrentDestination()"
        >
            📍 Aktuellen Kartenpunkt verwenden
        </button>

        <button
            class="action-button green"
            onclick="openGoogleMaps()"
        >
            🧭 In Google Maps öffnen
        </button>

    </div>


    <!-- TOAST -->

    <div
        id="toast"
        class="toast"
    ></div>

</div>


<!-- LEAFLET -->

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script>

/* =========================================================
   GRUNDEINSTELLUNGEN
========================================================= */

const MAUR_CENTER = [47.337, 8.667];

const MAUR_BOUNDS = [
    [47.285, 8.595],
    [47.375, 8.735]
];

let map;

let userMarker = null;

let destination = null;

let currentLocation = null;

let selectedMarker = null;


/* =========================================================
   KARTE
========================================================= */

map = L.map("map", {
    zoomControl: true,
    minZoom: 11,
    maxZoom: 19,
    maxBounds: MAUR_BOUNDS,
    maxBoundsViscosity: 0.8
}).setView(MAUR_CENTER, 13);


/* OSM ONLINE KARTE */

L.tileLayer(
    "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap-Mitwirkende'
    }
).addTo(map);


/* =========================================================
   LAYER
========================================================= */

const roadsLayer = L.layerGroup();

const binsLayer = L.layerGroup();

const winterLayer = L.layerGroup();

const specialLayer = L.layerGroup();

const propertiesLayer = L.layerGroup();

const ownLayer = L.layerGroup();


/* Strassen standardmässig sichtbar */

roadsLayer.addTo(map);


/* =========================================================
   DEMO-PUNKTE
========================================================= */

/* Abfallkübel */

const bin1 = L.marker([47.3377, 8.6665])
    .bindPopup(`
        <div class="popup-title">Abfallkübel</div>
        <div class="popup-text">
            Demo-Punkt<br>
            Standort später mit echten Gemeindedaten ersetzen.
        </div>
    `);

binsLayer.addLayer(bin1);


/* Winterdienst */

const winter1 = L.marker([47.3390, 8.6690])
    .bindPopup(`
        <div class="popup-title">Winterdienst</div>
        <div class="popup-text">
            Demo-Punkt<br>
            Winterdienst-Informationen können später ergänzt werden.
        </div>
    `);

winterLayer.addLayer(winter1);


/* Sonderpunkt */

const special1 = L.marker([47.3355, 8.6710])
    .bindPopup(`
        <div class="popup-title">Sonderpunkt</div>
        <div class="popup-text">
            Beispiel für einen Sonderpunkt.
        </div>
    `);

specialLayer.addLayer(special1);


/* Gemeindeliegenschaft */

const property1 = L.marker([47.3385, 8.6645])
    .bindPopup(`
        <div class="popup-title">Gemeindeliegenschaft</div>
        <div class="popup-text">
            Demo-Liegenschaft.
        </div>
    `);

propertiesLayer.addLayer(property1);


/* =========================================================
   LAYER STEUERUNG
========================================================= */

function toggleLayer(type) {

    let layer;

    switch (type) {

        case "roads":
            layer = roadsLayer;
            break;

        case "bins":
            layer = binsLayer;
            break;

        case "winter":
            layer = winterLayer;
            break;

        case "special":
            layer = specialLayer;
            break;

        case "properties":
            layer = propertiesLayer;
            break;

        case "own":
            layer = ownLayer;
            break;
    }

    if (!layer) return;

    if (map.hasLayer(layer)) {
        map.removeLayer(layer);
    } else {
        layer.addTo(map);
    }
}


/* =========================================================
   GPS
========================================================= */

function goToLocation() {

    if (!navigator.geolocation) {

        showToast("GPS wird von diesem Gerät nicht unterstützt.");

        return;
    }

    showToast("Standort wird gesucht...");

    navigator.geolocation.getCurrentPosition(

        function(position) {

            const lat = position.coords.latitude;

            const lon = position.coords.longitude;

            currentLocation = {
                lat: lat,
                lon: lon
            };

            if (userMarker) {

                map.removeLayer(userMarker);

            }

            userMarker = L.circleMarker(
                [lat, lon],
                {
                    radius: 9,
                    color: "#ffffff",
                    weight: 3,
                    fillColor: "#2563eb",
                    fillOpacity: 1
                }
            )
            .addTo(map)
            .bindPopup("📍 Dein aktueller Standort");


            map.setView(
                [lat, lon],
                17
            );

            showToast("Standort gefunden.");

        },

        function(error) {

            let message = "GPS konnte nicht ermittelt werden.";

            if (error.code === 1) {
                message = "GPS-Berechtigung wurde verweigert.";
            }

            if (error.code === 2) {
                message = "Standort momentan nicht verfügbar.";
            }

            if (error.code === 3) {
                message = "GPS-Zeitüberschreitung.";
            }

            showToast(message);

        },

        {
            enableHighAccuracy: true,
            timeout: 15000,
            maximumAge: 5000
        }

    );
}


/* =========================================================
   SUCHE
========================================================= */

const searchInput =
    document.getElementById("searchInput");

const searchButton =
    document.getElementById("searchButton");

const searchResults =
    document.getElementById("searchResults");


searchButton.addEventListener(
    "click",
    searchAddress
);


searchInput.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            searchAddress();

        }

    }
);


async function searchAddress() {

    const query =
        searchInput.value.trim();

    if (!query) {

        showToast("Bitte eine Adresse eingeben.");

        return;
    }


    if (!navigator.onLine) {

        showToast("Adresssuche ist offline nicht verfügbar.");

        return;
    }


    searchResults.style.display = "block";

    searchResults.innerHTML =
        `<div class="search-result">
            🔎 Suche läuft...
        </div>`;


    try {

        const url =
            "https://nominatim.openstreetmap.org/search" +
            "?format=json" +
            "&limit=8" +
            "&countrycodes=ch" +
            "&q=" +
            encodeURIComponent(query);


        const response =
            await fetch(url, {
                headers: {
                    "Accept": "application/json"
                }
            });


        const results =
            await response.json();


        if (!results.length) {

            searchResults.innerHTML =
                `<div class="search-result">
                    Keine Treffer gefunden.
                </div>`;

            return;
        }


        searchResults.innerHTML = "";


        results.forEach(
            function(result) {

                const item =
                    document.createElement("div");

                item.className =
                    "search-result";

                item.textContent =
                    result.display_name;


                item.addEventListener(
                    "click",
                    function() {

                        const lat =
                            parseFloat(result.lat);

                        const lon =
                            parseFloat(result.lon);


                        map.setView(
                            [lat, lon],
                            17
                        );


                        destination = {
                            lat: lat,
                            lon: lon,
                            name: result.display_name
                        };


                        L.marker(
                            [lat, lon]
                        )
                        .addTo(map)
                        .bindPopup(
                            `<div class="popup-title">
                                ${escapeHtml(result.display_name)}
                            </div>`
                        )
                        .openPopup();


                        searchResults.style.display =
                            "none";

                        searchInput.value =
                            result.display_name;

                    }
                );


                searchResults.appendChild(item);

            }
        );

    } catch (error) {

        searchResults.innerHTML =
            `<div class="search-result">
                Suche momentan nicht verfügbar.
            </div>`;

    }

}


/* =========================================================
   EIGENE PUNKTE
========================================================= */

function startAddPoint() {

    closePanels();

    showToast(
        "Tippe jetzt auf die Karte, um einen Punkt zu setzen."
    );


    map.once(
        "click",
        function(event) {

            const name =
                prompt(
                    "Name des Punktes:",
                    "Neuer Punkt"
                );


            if (name === null) {

                return;

            }


            const description =
                prompt(
                    "Beschreibung:",
                    ""
                );


            const point = {

                id:
                    Date.now(),

                lat:
                    event.latlng.lat,

                lon:
                    event.latlng.lng,

                name:
                    name || "Neuer Punkt",

                description:
                    description || "",

                created:
                    new Date().toISOString()

            };


            saveOwnPoint(point);

            createOwnMarker(point);

            showToast(
                "Punkt gespeichert."
            );

        }
    );

}


function createOwnMarker(point) {

    const marker =
        L.marker(
            [point.lat, point.lon]
        );


    marker.bindPopup(`
        <div class="popup-title">
            ⭐ ${escapeHtml(point.name)}
        </div>

        <div class="popup-text">
            ${escapeHtml(point.description || "Keine Beschreibung")}
        </div>

        <button
            class="action-button"
            onclick="navigateTo(${point.lat}, ${point.lon}, '${escapeJs(point.name)}')"
        >
            🧭 Navigation
        </button>

        <button
            class="action-button red"
            onclick="deleteOwnPoint(${point.id})"
        >
            🗑️ Punkt löschen
        </button>
    `);


    ownLayer.addLayer(marker);

}


/* =========================================================
   LOCAL STORAGE
========================================================= */

function getOwnPoints() {

    try {

        return JSON.parse(
            localStorage.getItem(
                "maurOwnPoints"
            )
        ) || [];

    } catch {

        return [];

    }

}


function saveOwnPoint(point) {

    const points =
        getOwnPoints();

    points.push(point);

    localStorage.setItem(
        "maurOwnPoints",
        JSON.stringify(points)
    );

}


function deleteOwnPoint(id) {

    const points =
        getOwnPoints()
        .filter(
            point =>
                point.id !== id
        );


    localStorage.setItem(
        "maurOwnPoints",
        JSON.stringify(points)
    );


    ownLayer.clearLayers();


    loadOwnPoints();


    showToast(
        "Punkt gelöscht."
    );

}


function loadOwnPoints() {

    const points =
        getOwnPoints();


    points.forEach(
        function(point) {

            createOwnMarker(point);

        }
    );

}


/* Eigene Punkte laden */

loadOwnPoints();


/* =========================================================
   NAVIGATION
========================================================= */

function openNavigation() {

    document.getElementById(
        "navigationPanel"
    ).style.display = "block";

}


function useCurrentDestination() {

    if (!destination) {

        showToast(
            "Bitte zuerst einen Zielpunkt auswählen."
        );

        return;
    }


    openGoogleMaps();

}


function navigateTo(
    lat,
    lon,
    name
) {

    destination = {

        lat: lat,

        lon: lon,

        name: name

    };


    openGoogleMaps();

}


function openGoogleMaps() {

    if (!destination) {

        showToast(
            "Kein Ziel ausgewählt."
        );

        return;
    }


    let url;


    if (currentLocation) {

        url =
            "https://www.google.com/maps/dir/?api=1" +
            "&origin=" +
            encodeURIComponent(
                currentLocation.lat +
                "," +
                currentLocation.lon
            ) +
            "&destination=" +
            encodeURIComponent(
                destination.lat +
                "," +
                destination.lon
            );

    } else {

        url =
            "https://www.google.com/maps/dir/?api=1" +
            "&destination=" +
            encodeURIComponent(
                destination.lat +
                "," +
                destination.lon
            );

    }


    window.open(
        url,
        "_blank"
    );

}


/* =========================================================
   LAYER PANEL
========================================================= */

function openLayers() {

    document.getElementById(
        "layersPanel"
    ).style.display = "block";

}


function closePanels() {

    document
        .querySelectorAll(".panel")
        .forEach(
            panel => {
                panel.style.display =
                    "none";
            }
        );

}


/* =========================================================
   KARTENKLICK
========================================================= */

map.on(
    "click",
    function(event) {

        destination = {

            lat:
                event.latlng.lat,

            lon:
                event.latlng.lng,

            name:
                "Kartenziel"

        };

    }
);


/* =========================================================
   ONLINE / OFFLINE STATUS
========================================================= */

function updateConnectionStatus() {

    const status =
        document.getElementById(
            "connectionStatus"
        );


    if (navigator.onLine) {

        status.textContent =
            "● Online";

        status.className =
            "status online";

    } else {

        status.textContent =
            "● Offline";

        status.className =
            "status offline";

    }

}


window.addEventListener(
    "online",
    updateConnectionStatus
);


window.addEventListener(
    "offline",
    updateConnectionStatus
);


updateConnectionStatus();


/* =========================================================
   TOAST
========================================================= */

let toastTimer = null;


function showToast(message) {

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.style.display =
        "block";


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            function() {

                toast.style.display =
                    "none";

            },
            3000
        );

}


/* =========================================================
   SICHERHEIT
========================================================= */

function escapeHtml(text) {

    return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


function escapeJs(text) {

    return String(text)
        .replaceAll("\\", "\\\\")
        .replaceAll("'", "\\'")
        .replaceAll("\n", " ");

}

   START
========================================================= */

setTimeout(
    function() {

        map.invalidateSize();

    },
    300
);
