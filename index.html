<!DOCTYPE html>
<html lang="de">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               viewport-fit=cover">

<meta name="theme-color" content="#111827">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style"
      content="black-translucent">

<title>Maur Strassendienst</title>

<link rel="manifest" href="./manifest.json">

<link rel="stylesheet"
      href="https://unpkg.com/maplibre-gl@5.13.0/dist/maplibre-gl.css">

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    background: #eef2f7;
}

#app {
    position: relative;
    width: 100%;
    height: 100%;
}

#map {
    position: absolute;
    inset: 0;
}


/* =========================
   HEADER
========================= */

header {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;

    z-index: 1000;

    padding: 12px;
    padding-top:
        calc(12px + env(safe-area-inset-top));

    background: rgba(17,24,39,.96);

    color: white;

    box-shadow:
        0 2px 10px rgba(0,0,0,.25);
}

.header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo {
    font-size: 21px;
    font-weight: 800;
    letter-spacing: .5px;
}

.subtitle {
    font-size: 12px;
    opacity: .75;
}

.status {
    padding: 6px 9px;
    border-radius: 20px;
    font-size: 12px;
    background: #166534;
}


/* =========================
   SEARCH
========================= */

.search {
    display: flex;
    gap: 7px;
    margin-top: 10px;
}

.search input {
    flex: 1;
    min-width: 0;

    border: 0;
    border-radius: 10px;

    padding: 12px;

    font-size: 15px;
    outline: none;
}

.search button {
    border: 0;
    border-radius: 10px;

    padding: 11px 14px;

    background: white;
    color: #111827;

    font-weight: 700;
}


/* =========================
   BOTTOM BAR
========================= */

.bottom-bar {
    position: absolute;

    left: 10px;
    right: 10px;

    bottom:
        calc(10px + env(safe-area-inset-bottom));

    z-index: 1000;

    display: grid;

    grid-template-columns:
        repeat(5,1fr);

    gap: 6px;
}

.bottom-bar button {
    border: 0;
    border-radius: 11px;

    background:
        rgba(17,24,39,.96);

    color: white;

    padding: 11px 3px;

    font-size: 12px;
    font-weight: 700;

    box-shadow:
        0 3px 10px rgba(0,0,0,.25);
}


/* =========================
   PANELS
========================= */

.panel {

    display: none;

    position: absolute;

    left: 10px;
    right: 10px;

    bottom:
        calc(76px + env(safe-area-inset-bottom));

    z-index: 2000;

    background: white;

    border-radius: 16px;

    padding: 16px;

    box-shadow:
        0 8px 30px rgba(0,0,0,.35);

    max-height: 70vh;

    overflow-y: auto;
}

.panel.active {
    display: block;
}

.panel h2 {
    margin: 0 0 12px;
    font-size: 19px;
}

.panel-row {

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 10px 0;

    border-bottom:
        1px solid #e5e7eb;
}

.panel-row:last-child {
    border-bottom: 0;
}

.panel input[type="checkbox"] {
    width: 20px;
    height: 20px;
}

.panel button {

    width: 100%;

    margin-top: 10px;

    border: 0;

    border-radius: 10px;

    padding: 12px;

    font-weight: 700;
}

.blue {
    background: #2563eb;
    color: white;
}

.close {
    background: #111827;
    color: white;
}


/* =========================
   VIEW BUTTONS
========================= */

.view-button {

    display: flex;

    align-items: center;

    justify-content: space-between;

    width: 100%;

    margin: 7px 0;

    padding: 14px;

    border: 0;

    border-radius: 12px;

    background: #f3f4f6;

    color: #111827;

    font-size: 15px;

    font-weight: 700;

    text-align: left;
}

.view-button.active {
    background: #2563eb;
    color: white;
}


/* =========================
   TOAST
========================= */

.toast {

    display: none;

    position: absolute;

    left: 50%;

    bottom:
        calc(90px + env(safe-area-inset-bottom));

    transform:
        translateX(-50%);

    z-index: 3000;

    background: #111827;

    color: white;

    padding: 10px 15px;

    border-radius: 20px;

    font-size: 13px;

    white-space: nowrap;

    box-shadow:
        0 4px 15px rgba(0,0,0,.3);
}


/* =========================
   MARKER
========================= */

.gps-marker {

    width: 22px;
    height: 22px;

    background: #2563eb;

    border: 4px solid white;

    border-radius: 50%;

    box-shadow:
        0 2px 8px rgba(0,0,0,.5);
}

.own-marker {

    width: 31px;
    height: 31px;

    background: #111827;

    color: white;

    border-radius: 50%;

    display: flex;

    align-items: center;
    justify-content: center;

    border: 3px solid white;

    box-shadow:
        0 2px 8px rgba(0,0,0,.4);
}


/* =========================
   MAP CONTROLS
========================= */

.maplibregl-ctrl-top-right {
    top: 145px;
}

</style>

</head>


<body>

<div id="app">


<header>

    <div class="header-top">

        <div>

            <div class="logo">
                MAUR
            </div>

            <div class="subtitle">
                Strassendienst
            </div>

        </div>

        <div id="connectionStatus"
             class="status">

            ● Online

        </div>

    </div>


    <div class="search">

        <input
            id="searchInput"
            type="text"
            placeholder="Adresse oder Ort suchen..."
        >

        <button onclick="searchAddress()">
            Suchen
        </button>

    </div>

</header>


<div id="map"></div>


<!-- =====================
     EBENEN
===================== -->

<div id="layersPanel"
     class="panel">

    <h2>Ebenen</h2>


    <div class="panel-row">

        <span>Strassen</span>

        <input
            id="roadsCheck"
            type="checkbox"
            checked
            onchange="toggleLayer('roads', this.checked)"
        >

    </div>


    <div class="panel-row">

        <span>Gebäude</span>

        <input
            id="buildingsCheck"
            type="checkbox"
            checked
            onchange="toggleLayer('buildings', this.checked)"
        >

    </div>


    <div class="panel-row">

        <span>Landschaft</span>

        <input
            id="landCheck"
            type="checkbox"
            checked
            onchange="toggleLayer('land', this.checked)"
        >

    </div>


    <div class="panel-row">

        <span>Wasser</span>

        <input
            id="waterCheck"
            type="checkbox"
            checked
            onchange="toggleLayer('water', this.checked)"
        >

    </div>


    <div class="panel-row">

        <span>Eigene Punkte</span>

        <input
            id="ownCheck"
            type="checkbox"
            checked
            onchange="toggleOwnPoints(this.checked)"
        >

    </div>


    <button
        class="close"
        onclick="closePanels()">

        Schliessen

    </button>

</div>


<!-- =====================
     ANSICHT
===================== -->

<div id="viewPanel"
     class="panel">

    <h2>🗺️ Kartenansicht</h2>


    <button
        id="normalViewButton"
        class="view-button active"
        onclick="changeView('normal')">

        <span>🗺️ Karte</span>

        <span>✓</span>

    </button>


    <button
        id="satelliteViewButton"
        class="view-button"
        onclick="changeView('satellite')">

        <span>🛰️ Satellit</span>

        <span></span>

    </button>


    <button
        id="hybridViewButton"
        class="view-button"
        onclick="changeView('hybrid')">

        <span>🗺️🛰️ Hybrid</span>

        <span></span>

    </button>


    <button
        class="close"
        onclick="closePanels()">

        Schliessen

    </button>

</div>


<!-- =====================
     NAVIGATION
===================== -->

<div id="navPanel"
     class="panel">

    <h2>Navigation</h2>

    <p>
        <b>Ziel:</b>
    </p>

    <div id="destinationText">

        Noch kein Ziel ausgewählt.

    </div>


    <button
        class="blue"
        onclick="useCurrentLocationAsStart()">

        📍 Aktuellen Standort verwenden

    </button>


    <button
        class="blue"
        onclick="openGoogleMaps()">

        🧭 Navigation starten

    </button>


    <button
        class="close"
        onclick="closePanels()">

        Schliessen

    </button>

</div>


<!-- =====================
     EIGENER PUNKT
===================== -->

<div id="pointPanel"
     class="panel">

    <h2>Eigenen Punkt setzen</h2>

    <p>
        Setze einen Punkt direkt
        auf der Karte.
    </p>


    <button
        class="blue"
        onclick="startAddPoint()">

        📍 Punkt auf Karte setzen

    </button>


    <button
        class="close"
        onclick="closePanels()">

        Abbrechen

    </button>

</div>


<div id="toast"
     class="toast">
</div>


<!-- =====================
     BOTTOM BAR
===================== -->

<div class="bottom-bar">

    <button onclick="goToLocation()">
        📍<br>
        Standort
    </button>


    <button onclick="openLayers()">
        ☰<br>
        Ebenen
    </button>


    <button onclick="openViewPanel()">
        🗺️<br>
        Ansicht
    </button>


    <button onclick="openNavigation()">
        🧭<br>
        Navi
    </button>


    <button onclick="openPointPanel()">
        ➕<br>
        Punkt
    </button>

</div>


</div>


<!-- =========================
     LIBRARIES
========================= -->

<script
    src="https://unpkg.com/maplibre-gl@5.13.0/dist/maplibre-gl.js">
</script>

<script
    src="https://unpkg.com/pmtiles@4.5.0/dist/pmtiles.js">
</script>


<script>

/* =========================
   PMTILES
========================= */

const protocol =
    new pmtiles.Protocol();

maplibregl.addProtocol(
    "pmtiles",
    protocol.tile
);

const PMTILES_URL =
    "./maur.pmtiles";

const pmtilesArchive =
    new pmtiles.PMTiles(
        PMTILES_URL
    );

protocol.add(
    pmtilesArchive
);


/* =========================
   VARIABLEN
========================= */

let map;

let gpsMarker = null;

let ownMarkers = [];

let addingPoint = false;

let currentDestination = null;

let currentView = "normal";


/* =========================
   MAP START
========================= */

pmtilesArchive
.getHeader()
.then(header => {

    const centerLon =
        header.centerLon || 8.667;

    const centerLat =
        header.centerLat || 47.337;


    map =
        new maplibregl.Map({

            container: "map",

            center: [
                centerLon,
                centerLat
            ],

            zoom: 13,

            minZoom: 8,

            maxZoom: 19,


            style: {

                version: 8,

                glyphs:
                    "https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf",


                sources: {

                    maur: {

                        type: "vector",

                        url:
                            "pmtiles://" +
                            PMTILES_URL,

                        attribution:
                            "© OpenStreetMap contributors"

                    },


                    satellite: {

                        type: "raster",

                        tiles: [

                            "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"

                        ],

                        tileSize: 256,

                        maxzoom: 19,

                        attribution:
                            "© Esri"

                    }

                },


                layers: [


                    /* =================
                       SATELLIT
                    ================= */

                    {

                        id: "satellite",

                        type: "raster",

                        source: "satellite",

                        layout: {

                            visibility:
                                "none"

                        }

                    },


                    /* =================
                       HINTERGRUND
                    ================= */

                    {

                        id: "background",

                        type: "background",

                        paint: {

                            "background-color":
                                "#f1f3f5"

                        }

                    },


                    /* =================
                       LAND
                    ================= */

                    {

                        id: "land",

                        type: "fill",

                        source: "maur",

                        "source-layer":
                            "land",

                        paint: {

                            "fill-color":

                                [

                                    "match",

                                    [
                                        "get",
