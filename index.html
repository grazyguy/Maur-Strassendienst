<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Maur Strassendienst</title>

<link rel="manifest" href="./manifest.json">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.7.0/dist/maplibre-gl.css">

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: #111827;
}

#app {
    position: relative;
    width: 100%;
    height: 100%;
}

#map {
    position: absolute;
    inset: 0;
}

header {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 1000;
    padding: 12px;
    padding-top: calc(12px + env(safe-area-inset-top));
    background: rgba(17, 24, 39, 0.95);
    color: white;
}

.header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo {
    font-size: 20px;
    font-weight: 800;
}

.subtitle {
    font-size: 12px;
    opacity: 0.75;
}

.status {
    font-size: 12px;
    padding: 6px 9px;
    border-radius: 20px;
    background: #166534;
}

.search {
    display: flex;
    gap: 7px;
    margin-top: 10px;
}

.search input {
    flex: 1;
    min-width: 0;
    border: 0;
    border-radius: 10px;
    padding: 12px;
    font-size: 15px;
    outline: none;
}

.search button {
    border: 0;
    border-radius: 10px;
    padding: 11px 13px;
    background: white;
    color: #111827;
    font-weight: 700;
}

.bottom-bar {
    position: absolute;
    left: 10px;
    right: 10px;
    bottom: calc(10px + env(safe-area-inset-bottom));
    z-index: 1000;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 7px;
}

.bottom-bar button {
    border: 0;
    border-radius: 10px;
    background: rgba(17, 24, 39, 0.95);
    color: white;
    padding: 13px 5px;
    font-size: 14px;
    font-weight: 700;
}

.panel {
    display: none;
    position: absolute;
    left: 10px;
    right: 10px;
    bottom: calc(75px + env(safe-area-inset-bottom));
    z-index: 2000;
    background: white;
    border-radius: 16px;
    padding: 16px;
    box-shadow: 0 8px 30px rgba(0,0,0,.35);
    max-height: 70vh;
    overflow-y: auto;
}

.panel.active {
    display: block;
}

.panel h2 {
    margin: 0 0 12px;
    font-size: 19px;
}

.panel-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid #e5e7eb;
}

.panel-row:last-child {
    border-bottom: 0;
}

.panel input[type="checkbox"] {
    width: 20px;
    height: 20px;
}

.panel button {
    width: 100%;
    margin-top: 10px;
    border: 0;
    border-radius: 10px;
    padding: 12px;
    font-weight: 700;
}

.close {
    background: #111827;
    color: white;
}

.blue {
    background: #2563eb;
    color: white;
}

.red {
    background: #dc2626;
    color: white;
}

.info-box {
    background: #f3f4f6;
    border-radius: 10px;
    padding: 10px;
    margin-top: 10px;
    font-size: 14px;
}

.toast {
    display: none;
    position: absolute;
    left: 50%;
    bottom: calc(85px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    z-index: 3000;
    background: #111827;
    color: white;
    padding: 10px 15px;
    border-radius: 20px;
    font-size: 13px;
    white-space: nowrap;
}

.maplibregl-ctrl-top-right {
    top: 135px;
}

.gps-marker {
    width: 22px;
    height: 22px;
    background: #2563eb;
    border: 4px solid white;
    border-radius: 50%;
    box-shadow: 0 2px 8px rgba(0,0,0,.4);
}

.own-marker {
    width: 30px;
    height: 30px;
    background: #111827;
    color: white;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 3px solid white;
    box-shadow: 0 2px 8px rgba(0,0,0,.4);
    font-size: 14px;
}
</style>
</head>

<body>

<div id="app">

<header>

    <div class="header-top">

        <div>
            <div class="logo">MAUR</div>
            <div class="subtitle">Strassendienst</div>
        </div>

        <div id="connectionStatus" class="status">
            ● Online
        </div>

    </div>

    <div class="search">

        <input
            id="searchInput"
            type="text"
            placeholder="Adresse oder Ort suchen..."
        >

        <button onclick="searchAddress()">
            Suchen
        </button>

    </div>

</header>

<div id="map"></div>


<!-- EBENEN -->

<div id="layersPanel" class="panel">

    <h2>Ebenen</h2>

    <div class="panel-row">
        <span>Strassen</span>
        <input id="roadsCheck" type="checkbox" checked>
    </div>

    <div class="panel-row">
        <span>Abfallkübel</span>
        <input id="binsCheck" type="checkbox">
    </div>

    <div class="panel-row">
        <span>Winterdienst</span>
        <input id="winterCheck" type="checkbox">
    </div>

    <div class="panel-row">
        <span>Sonderpunkte</span>
        <input id="specialCheck" type="checkbox">
    </div>

    <div class="panel-row">
        <span>Gemeindeliegenschaften</span>
        <input id="propertiesCheck" type="checkbox">
    </div>

    <div class="panel-row">
        <span>Eigene Punkte</span>
        <input id="ownCheck" type="checkbox" checked>
    </div>

    <button class="close" onclick="closePanels()">
        Schliessen
    </button>

</div>


<!-- NAVIGATION -->

<div id="navPanel" class="panel">

    <h2>Navigation</h2>

    <div class="info-box">

        <b>Ziel:</b>

        <div id="destinationText">
            Noch kein Ziel ausgewählt.
        </div>

    </div>

    <button class="blue" onclick="useCurrentLocationAsStart()">
        📍 Aktuellen Standort verwenden
    </button>

    <button class="blue" onclick="openGoogleMaps()">
        🧭 Navigation starten
    </button>

    <button class="close" onclick="closePanels()">
        Schliessen
    </button>

</div>


<!-- EIGENER PUNKT -->

<div id="pointPanel" class="panel">

    <h2>Eigenen Punkt setzen</h2>

    <div class="info-box">
        Tippe anschliessend auf der Karte auf die gewünschte Stelle.
    </div>

    <button class="blue" onclick="startAddPoint()">
        📍 Punkt auf Karte setzen
    </button>

    <button class="close" onclick="closePanels()">
        Abbrechen
    </button>

</div>


<div id="toast" class="toast"></div>


<!-- UNTERE NAVIGATION -->

<div class="bottom-bar">

    <button onclick="goToLocation()">
        📍<br>Standort
    </button>

    <button onclick="openLayers()">
        ☰<br>Ebenen
    </button>

    <button onclick="openNavigation()">
        🧭<br>Navi
    </button>

    <button onclick="openPointPanel()">
        ➕<br>Punkt
    </button>

</div>

</div>


<script src="https://unpkg.com/pmtiles@4.5.0/dist/pmtiles.js"></script>

<script type="module">

import * as maplibregl
    from "https://unpkg.com/maplibre-gl@6.7.0/dist/maplibre-gl.mjs";


/* ==========================================
   PMTILES
========================================== */

const protocol = new pmtiles.Protocol();

maplibregl.addProtocol(
    "pmtiles",
    protocol.tile
);

const PMTILES_URL =
    "./maur.pmtiles";

const p =
    new pmtiles.PMTiles(PMTILES_URL);

protocol.add(p);


/* ==========================================
   KARTE
========================================== */

let map;

p.getHeader().then(header => {

    map = new maplibregl.Map({

        container: "map",

        center: [
            header.centerLon || 8.667,
            header.centerLat || 47.337
        ],

        zoom: 13,

        minZoom: 10,

        maxZoom: 19,

        style: {

            version: 8,

            sources: {

                maur: {

                    type: "vector",

                    url:
                        "pmtiles://" +
                        PMTILES_URL,

                    attribution:
                        "© OpenStreetMap contributors"

                }

            },

            layers: [

                /* Wasser */

                {
                    id: "water",
                    type: "fill",
                    source: "maur",
                    "source-layer": "water",
                    paint: {
                        "fill-color": "#9ecae1"
                    }
                },


                /* Land */

                {
                    id: "landuse",
                    type: "fill",
                    source: "maur",
                    "source-layer": "landuse",
                    paint: {
                        "fill-color": "#e5e7eb",
                        "fill-opacity": 0.55
                    }
                },


                /* Gebäude */

                {
                    id: "buildings",
                    type: "fill",
                    source: "maur",
                    "source-layer": "buildings",
                    paint: {
                        "fill-color": "#d1d5db",
                        "fill-opacity": 0.8
                    }
                },


                /* Strassen */

                {
                    id: "roads",

                    type: "line",

                    source: "maur",

                    "source-layer": "transportation",

                    paint: {

                        "line-color": "#ffffff",

                        "line-width": [
                            "interpolate",
                            ["linear"],
                            ["zoom"],
                            10, 0.5,
                            13, 2,
                            16, 5,
                            19, 9
                        ]

                    }
                },


                /* Grössere Strassen */

                {
                    id: "major-roads",

                    type: "line",

                    source: "maur",

                    "source-layer": "transportation",

                    filter: [
                        "in",
                        "class",
                        "motorway",
                        "trunk",
                        "primary",
                        "secondary"
                    ],

                    paint: {

                        "line-color": "#f4b942",

                        "line-width": [
                            "interpolate",
                            ["linear"],
                            ["zoom"],
                            10, 1,
                            13, 2,
                            16, 5,
                            19, 10
                        ]

                    }
                }

            ]

        }

    });


    /* ======================================
       MAP LOAD
    ====================================== */

    map.on("load", function() {

        map.addControl(
            new maplibregl.NavigationControl(),
            "top-right"
        );

        map.on("click", function(e) {

            if (window.addingPoint) {

                createOwnPoint(
                    e.lngLat.lat,
                    e.lngLat.lng
                );

                return;
            }


            window.lastDestination = {

                lat: e.lngLat.lat,

                lng: e.lngLat.lng,

                name:
                    e.lngLat.lat.toFixed(6) +
                    ", " +
                    e.lngLat.lng.toFixed(6)

            };

            document.getElementById(
                "destinationText"
            ).textContent =
                window.lastDestination.name;

        });

        loadOwnPoints();

    });

});


/* ==========================================
   GPS
========================================== */

let currentLocationMarker = null;

let currentLocation = null;


window.goToLocation = function() {

    if (!navigator.geolocation) {

        showToast(
            "GPS wird nicht unterstützt."
        );

        return;
    }


    showToast(
        "Standort wird gesucht..."
    );


    navigator.geolocation.getCurrentPosition(

        function(position) {

            const lat =
                position.coords.latitude;

            const lng =
                position.coords.longitude;


            currentLocation = {
                lat: lat,
                lng: lng
            };


            if (currentLocationMarker) {

                currentLocationMarker.remove();

            }


            const element =
                document.createElement("div");

            element.className =
                "gps-marker";


            currentLocationMarker =
                new maplibregl.Marker({
                    element: element
                })
                .setLngLat([lng, lat])
                .addTo(map);


            map.flyTo({

                center: [lng, lat],

                zoom: 17,

                speed: 1.2

            });


            showToast(
                "Standort gefunden."
            );

        },

        function() {

            showToast(
                "Standort konnte nicht ermittelt werden."
            );

        },

        {

            enableHighAccuracy: true,

            timeout: 10000,

            maximumAge: 30000

        }

    );

};


/* ==========================================
   ADRESSSUCHE
========================================== */

window.searchAddress = async function() {

    const input =
        document.getElementById(
            "searchInput"
        );

    const query =
        input.value.trim();


    if (!query) {

        showToast(
            "Bitte Adresse eingeben."
        );

        return;
    }


    if (!navigator.onLine) {

        showToast(
            "Die Suche benötigt Internet."
        );

        return;
    }


    showToast(
        "Suche läuft..."
    );


    try {

        const url =
            "https://nominatim.openstreetmap.org/search" +
            "?format=json" +
            "&limit=5" +
            "&countrycodes=ch" +
            "&q=" +
            encodeURIComponent(
                query + ", Maur, Schweiz"
            );


        const response =
            await fetch(url);


        const data =
            await response.json();


        if (!data.length) {

            showToast(
                "Keine Adresse gefunden."
            );

            return;
        }


        const result =
            data[0];


        const lat =
            Number(result.lat);

        const lon =
            Number(result.lon);


        map.flyTo({

            center: [lon, lat],

            zoom: 17,

            speed: 1.2

        });


        new maplibregl.Marker()

            .setLngLat([lon, lat])

            .setPopup(

                new maplibregl.Popup()
                    .setHTML(
                        "<b>Suchergebnis</b><br>" +
                        escapeHtml(
                            result.display_name
                        )
                    )

            )

            .addTo(map)

            .togglePopup();


        window.lastDestination = {

            lat: lat,

            lng: lon,

            name:
                result.display_name

        };


        document.getElementById(
            "destinationText"
        ).textContent =
            result.display_name;


        showToast(
            "Adresse gefunden."
        );


    } catch (error) {

        console.error(error);

        showToast(
            "Suche fehlgeschlagen."
        );

    }

};


/* ==========================================
   EIGENE PUNKTE
========================================== */

window.addingPoint = false;


window.startAddPoint = function() {

    closePanels();

    window.addingPoint = true;

    showToast(
        "Tippe jetzt auf die Karte."
    );

    document.getElementById(
        "map"
    ).style.cursor = "crosshair";

};


function createOwnPoint(lat, lng) {

    window.addingPoint = false;

    document.getElementById(
        "map"
    ).style.cursor = "";


    const name =
        prompt(
            "Name des Punktes:"
        );


    if (!name) {

        return;

    }


    const description =
        prompt(
            "Beschreibung (optional):"
        ) || "";


    const point = {

        id: Date.now(),

        name: name,

        description: description,

        lat: lat,

        lng: lng

    };


    const points =
        getOwnPoints();


    points.push(point);


    localStorage.setItem(

        "maurOwnPoints",

        JSON.stringify(points)

    );


    addOwnMarker(point);


    showToast(
        "Punkt gespeichert."
    );

}


function addOwnMarker(point) {

    const element =
        document.createElement("div");

    element.className =
        "own-marker";

    element.textContent =
        "📍";


    const marker =
        new maplibregl.Marker({
            element: element
        })

        .setLngLat([
            point.lng,
            point.lat
        ])

        .setPopup(

            new maplibregl.Popup()

                .setHTML(

                    "<b>" +
                    escapeHtml(point.name) +
                    "</b><br>" +

                    escapeHtml(
                        point.description
                    ) +

                    "<br><br>" +

                    "<button onclick=\"deleteOwnPoint(" +
                    point.id +
                    ")\" style='padding:8px;background:#dc2626;color:white;border:0;border-radius:8px'>" +
                    "Punkt löschen" +
                    "</button>"

                )

        )

        .addTo(map);


    point._marker =
        marker;

}


function loadOwnPoints() {

    const points =
        getOwnPoints();


    points.forEach(
        point =>
            addOwnMarker(point)
    );

}


function getOwnPoints() {

    try {

        return JSON.parse(

            localStorage.getItem(
                "maurOwnPoints"
            ) || "[]"

        );

    } catch {

        return [];

    }

}


window.deleteOwnPoint = function(id) {

    const points =
        getOwnPoints().filter(
            p => p.id !== id
        );


    localStorage.setItem(

        "maurOwnPoints",

        JSON.stringify(points)

    );


    location.reload();

};


/* ==========================================
   NAVIGATION
========================================== */

window.lastDestination = null;


window.useCurrentLocationAsStart = function() {

    if (!currentLocation) {

        showToast(
            "Zuerst Standort ermitteln."
        );

        goToLocation();

        return;
    }


    showToast(
        "Aktueller Standort ist Startpunkt."
    );

};


window.openGoogleMaps = function() {

    if (!window.lastDestination) {

        showToast(
            "Bitte zuerst ein Ziel auswählen."
        );

        return;
    }


    let url;


    if (currentLocation) {

        url =
            "https://www.google.com/maps/dir/" +

            currentLocation.lat +
            "," +
            currentLocation.lng +

            "/" +

            window.lastDestination.lat +
            "," +
            window.lastDestination.lng;

    } else {

        url =
            "https://www.google.com/maps/dir/?api=1" +

            "&destination=" +

            window.lastDestination.lat +
            "," +
            window.lastDestination.lng;

    }


    window.open(
        url,
        "_blank"
    );

};


/* ==========================================
   PANELS
========================================== */

window.openLayers = function() {

    closePanels();

    document
        .getElementById("layersPanel")
        .classList.add("active");

};


window.openNavigation = function() {

    closePanels();

    document
        .getElementById("navPanel")
        .classList.add("active");

};


window.openPointPanel = function() {

    closePanels();

    document
        .getElementById("pointPanel")
        .classList.add("active");

};


window.closePanels = function() {

    document
        .querySelectorAll(".panel")
        .forEach(
            panel =>
                panel.classList.remove("active")
        );

};


/* ==========================================
   EBENEN
========================================== */

document
    .getElementById("ownCheck")
    .addEventListener(
        "change",
        function() {

            document
                .querySelectorAll(".own-marker")
                .forEach(marker => {

                    marker.style.display =
                        this.checked
                            ? "flex"
                            : "none";

                });

        }
    );


/* ==========================================
   ONLINE / OFFLINE
========================================== */

function updateConnectionStatus() {

    const status =
        document.getElementById(
            "connectionStatus"
        );


    if (navigator.onLine) {

        status.textContent =
            "● Online";

        status.style.background =
            "#166534";

    } else {

        status.textContent =
            "● Offline";

        status.style.background =
            "#991b1b";

    }

}


window.addEventListener(
    "online",
    updateConnectionStatus
);


window.addEventListener(
    "offline",
    updateConnectionStatus
);


updateConnectionStatus();


/* ==========================================
   TOAST
========================================== */

function showToast(message) {

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.style.display =
        "block";


    clearTimeout(
        window.toastTimer
    );


    window.toastTimer =
        setTimeout(
            () => {

                toast.style.display =
                    "none";

            },
            3000
        );

}


/* ==========================================
   HTML SICHER MACHEN
========================================== */

function escapeHtml(text) {

    return String(text)

        .replaceAll("&", "&amp;")

        .replaceAll("<", "&lt;")

        .replaceAll(">", "&gt;")

        .replaceAll('"', "&quot;")

        .replaceAll("'", "&#039;");

}


/* ==========================================
   SERVICE WORKER
========================================== */

if ("serviceWorker" in navigator) {

    window.addEventListener(
        "load",
        function() {

            navigator.serviceWorker

                .register("./sw.js")

                .then(
                    () =>
                        console.log(
                            "Maur Strassendienst: Service Worker aktiv"
                        )
                )

                .catch(
                    error =>
                        console.error(
                            "Service Worker Fehler:",
                            error
                        )
                );

        }
    );

}

</script>

</body>
</html>
